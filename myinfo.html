<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>PKL MY INFO</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05050a;color:#f8fafc;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif}
a{text-decoration:none;color:inherit}
button,input,select{font-family:inherit}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
}

.my-page{
  position:relative;
  min-height:100vh;
  isolation:isolate;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:120px 24px 80px;
}

.my-page::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("login_bg.webp") center/cover no-repeat;
  z-index:-3;
  transform:scale(1.01);
}

.my-page::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 52%,rgba(168,85,247,.13),transparent 30%),
    linear-gradient(180deg,rgba(0,0,0,.08),rgba(0,0,0,.16) 38%,rgba(0,0,0,.64));
  z-index:-2;
}


.my-shell{
  width:min(620px,92vw);
  margin-top:150px;
  position:relative;
}

.my-shell::before{
  content:"";
  position:absolute;
  left:50%;
  top:-14px;
  width:70%;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#9d5cff,#efe7ff,#9d5cff,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.9),0 0 42px rgba(168,85,247,.42);
}

.my-card{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  border:1px solid rgba(210,183,255,.34);
  background:
    linear-gradient(180deg,rgba(9,9,18,.80),rgba(5,5,11,.90)),
    rgba(8,7,15,.84);
  box-shadow:
    0 28px 80px rgba(0,0,0,.58),
    0 0 38px rgba(168,85,247,.18),
    inset 0 0 42px rgba(255,255,255,.025);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:44px 52px 38px;
}

.my-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.18),transparent 32%),
    linear-gradient(120deg,transparent 0%,rgba(255,255,255,.045) 45%,transparent 70%);
  pointer-events:none;
}

.my-card::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#a855f7,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.8);
}

.my-title{
  position:relative;
  margin:0 0 10px;
  text-align:center;
  font-size:34px;
  line-height:1;
  letter-spacing:7px;
  font-weight:1000;
  color:#f7f2ff;
  text-shadow:0 0 16px rgba(168,85,247,.72),0 0 34px rgba(168,85,247,.24);
}

.my-sub{
  margin:0 0 30px;
  text-align:center;
  font-size:13px;
  font-weight:900;
  letter-spacing:.6px;
  color:rgba(233,213,255,.64);
}

.info-grid{
  display:grid;
  gap:14px;
  margin-bottom:24px;
}

.info-row{
  position:relative;
  overflow:hidden;
  min-height:58px;
  display:grid;
  grid-template-columns:138px 1fr;
  align-items:center;
  gap:16px;
  padding:0 18px;
  border-radius:8px;
  border:1px solid rgba(196,181,253,.18);
  background:
    linear-gradient(135deg,rgba(220,220,220,.12),transparent 34%),
    rgba(8,8,12,.75);
  box-shadow:
    inset 0 0 22px rgba(0,0,0,.34),
    inset 0 0 18px rgba(168,85,247,.035);
  opacity:.88;
}

.info-row::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    repeating-linear-gradient(
      -45deg,
      rgba(220,220,220,.12) 0px,
      rgba(220,220,220,.12) 1px,
      transparent 1px,
      transparent 8px
    );
  opacity:.42;
  pointer-events:none;
}

.info-row::after{
  content:"수정 불가";
  position:absolute;
  right:16px;
  top:50%;
  transform:translateY(-50%);
  height:24px;
  padding:0 9px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:999px;
  border:1px solid rgba(255,107,107,.35);
  background:rgba(0,0,0,.28);
  color:#ff6b6b;
  font-size:11px;
  font-weight:1000;
  letter-spacing:-.2px;
  pointer-events:none;
}

.info-label{
  color:#c4b5fd;
  font-size:12px;
  font-weight:1000;
  letter-spacing:.8px;
}

.info-value{
  padding-right:78px;
  color:#fff;
  font-size:16px;
  font-weight:1000;
  letter-spacing:.2px;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}

.section-line{
  display:flex;
  align-items:center;
  gap:16px;
  margin:22px 0 18px;
  color:rgba(255,255,255,.64);
  font-size:13px;
  font-weight:1000;
  letter-spacing:1px;
}

.section-line::before,
.section-line::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(196,181,253,.34));
}
.section-line::after{transform:scaleX(-1)}

.form{
  display:grid;
  gap:14px;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  color:#c4b5fd;
  font-size:18px;
  opacity:.92;
  text-shadow:0 0 12px rgba(168,85,247,.48);
  pointer-events:none;
}



.input-icon svg{
  width:20px;
  height:20px;
  display:block;
  fill:none;
  stroke:currentColor;
  stroke-width:1.8;
  stroke-linecap:round;
  stroke-linejoin:round;
  filter:drop-shadow(0 0 8px rgba(168,85,247,.42));
}

.input-wrap select{
  width:100%;
  height:52px;
  border-radius:6px;
  border:1px solid rgba(196,181,253,.32);
  background:
    linear-gradient(180deg,rgba(20,14,40,.78),rgba(5,5,12,.82)),
    rgba(4,4,10,.64);
  color:#fff;
  outline:none;
  padding:0 52px 0 58px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.24);
  transition:.18s;
  appearance:none;
  -webkit-appearance:none;
  cursor:pointer;
}

.input-wrap select:focus{
  border-color:rgba(168,85,247,.86);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.18),
    0 0 22px rgba(168,85,247,.24),
    inset 0 0 18px rgba(168,85,247,.045);
}

.input-wrap select option{
  background:#0b0714;
  color:#fff;
  font-weight:800;
}

.select-wrap::after{
  content:"";
  position:absolute;
  right:20px;
  top:50%;
  width:9px;
  height:9px;
  border-right:2px solid rgba(216,180,254,.92);
  border-bottom:2px solid rgba(216,180,254,.92);
  transform:translateY(-68%) rotate(45deg);
  pointer-events:none;
  filter:drop-shadow(0 0 8px rgba(168,85,247,.65));
}

.input-wrap input{
  width:100%;
  height:52px;
  border-radius:6px;
  border:1px solid rgba(196,181,253,.32);
  background:rgba(4,4,10,.64);
  color:#fff;
  outline:none;
  padding:0 18px 0 58px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.24);
  transition:.18s;
}

.input-wrap input::placeholder{
  color:rgba(255,255,255,.45);
  font-weight:900;
  letter-spacing:.3px;
}

.input-wrap input:focus{
  border-color:rgba(168,85,247,.86);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.18),
    0 0 22px rgba(168,85,247,.24),
    inset 0 0 18px rgba(168,85,247,.045);
}


.msg.error{color:#fca5a5}
.msg.success{color:#c4b5fd}


.btn{
  height:58px;
  border-radius:7px;
  color:#fff;
  font-size:16px;
  font-weight:1000;
  letter-spacing:.4px;
  cursor:pointer;
  transition:.18s;
}

.save-btn{
  border:1px solid rgba(208,178,255,.58);
  background:
    linear-gradient(180deg,rgba(126,68,255,.34),rgba(66,31,132,.36)),
    rgba(10,7,20,.72);
  box-shadow:0 0 20px rgba(168,85,247,.34),inset 0 0 24px rgba(168,85,247,.12);
}

.delete-btn{
  border:1px solid rgba(248,113,113,.44);
  background:
    linear-gradient(180deg,rgba(127,29,29,.30),rgba(69,10,10,.34)),
    rgba(10,7,20,.72);
  box-shadow:0 0 18px rgba(248,113,113,.16),inset 0 0 22px rgba(248,113,113,.07);
  color:#fecaca;
}

.btn:hover{
  transform:translateY(-2px);
}

.save-btn:hover{
  border-color:rgba(233,213,255,.88);
  box-shadow:0 0 28px rgba(168,85,247,.56),0 14px 34px rgba(0,0,0,.28),inset 0 0 26px rgba(168,85,247,.18);
}

.delete-btn:hover{
  border-color:rgba(252,165,165,.78);
  box-shadow:0 0 28px rgba(248,113,113,.26),0 14px 34px rgba(0,0,0,.28),inset 0 0 26px rgba(248,113,113,.10);
}

.notice{
  margin-top:16px;
  padding:13px 15px;
  border:1px solid rgba(168,85,247,.22);
  border-radius:7px;
  background:rgba(168,85,247,.055);
  color:rgba(255,255,255,.62);
  font-size:12px;
  line-height:1.6;
  font-weight:800;
  word-break:keep-all;
}

@media (max-width:700px){
  .my-page{padding:86px 16px 80px}
  .my-shell{margin-top:110px}
  .my-card{padding:34px 24px 30px}
  .my-title{font-size:28px;letter-spacing:5px}
  .info-row{grid-template-columns:1fr;gap:4px;padding:14px 16px}
  .lock-badge{justify-self:start}
  

  

}


.msg{
  display:none;
  margin:0;
  text-align:center;
  font-size:13px;
  font-weight:900;
}

.msg.active{
  display:block;
  margin-top:4px;
}

.msg.error{color:#fca5a5}
.msg.success{color:#c4b5fd}

.action-row{
  display:grid;
  grid-template-columns:1fr;
  gap:12px;
  margin-top:8px;
}

.action-row .btn{
  width:100%;
  height:50px;
  font-size:14px;
}

/* DELETE MODAL */
.modal-wrap{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.6);
  display:flex;
  align-items:center;
  justify-content:center;
  z-index:99999;
  opacity:0;
  pointer-events:none;
  transition:.2s;
}

.modal-wrap.show{
  opacity:1;
  pointer-events:auto;
}

.modal-box{
  width:420px;
  padding:32px;
  border-radius:14px;
  background:rgba(10,8,20,.95);
  border:1px solid rgba(168,85,247,.4);
  box-shadow:0 0 40px rgba(168,85,247,.3);
  text-align:center;
}

.modal-title{
  font-size:20px;
  font-weight:1000;
  margin-bottom:10px;
}

.modal-desc{
  font-size:14px;
  color:#ccc;
  margin-bottom:24px;
}

.modal-actions{
  display:flex;
  gap:10px;
}

.modal-btn{
  flex:1;
  height:44px;
  border-radius:8px;
  border:none;
  font-weight:900;
  cursor:pointer;
}

.modal-btn.no{
  background:#333;
  color:#aaa;
}

.modal-btn.yes{
  background:linear-gradient(90deg,#ff4d4d,#ff0000);
  color:#fff;
}


.back-home{
  position:fixed;
  left:28px;
  top:24px;
  z-index:99999;
  min-width:120px;
  height:46px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  border:1px solid rgba(168,85,247,.65);
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.55),transparent 55%),
    linear-gradient(180deg,rgba(22,14,48,.95),rgba(6,6,14,.98));
  color:#ffffff;
  font-size:14px;
  font-weight:1000;
  letter-spacing:.6px;
  text-shadow:0 0 16px rgba(168,85,247,1);
  box-shadow:
    0 0 28px rgba(168,85,247,.6),
    0 18px 40px rgba(0,0,0,.45),
    inset 0 0 18px rgba(255,255,255,.06);
  text-decoration:none;
  cursor:pointer;
}

.back-home:hover{
  color:#fff;
  border-color:rgba(168,85,247,.72);
  box-shadow:0 0 18px rgba(168,85,247,.25);
}


/* PKL MYINFO CLEAN EDIT FORM */
.my-card{padding:46px 52px 38px !important;}
.my-sub{margin-bottom:28px !important;}
.info-grid{gap:14px !important;margin-bottom:20px !important;}
.info-row{display:block !important;min-height:auto !important;padding:0 !important;border:none !important;background:transparent !important;box-shadow:none !important;opacity:1 !important;overflow:visible !important;}
.info-row::before,.info-row::after{display:none !important;content:none !important;}
.profile-field{
  position:relative;
  display:grid;
  grid-template-columns:132px minmax(0,1fr) 108px;
  align-items:center;
  gap:10px;
  min-height:70px;
  padding:10px;
  border-radius:10px;
  border:1px solid rgba(196,181,253,.24);
  background:linear-gradient(135deg,rgba(255,255,255,.08),rgba(124,58,237,.05) 42%,rgba(0,0,0,.24)),rgba(9,8,18,.74);
  box-shadow:inset 0 0 22px rgba(0,0,0,.30),0 0 18px rgba(168,85,247,.055);
}
.profile-field.is-single{grid-template-columns:132px minmax(0,1fr);}
.profile-label{
  display:flex;align-items:center;height:48px;padding:0 8px;
  color:#d8c8ff;font-size:12px;font-weight:1000;letter-spacing:.8px;
  text-transform:uppercase;white-space:nowrap;
}
.profile-control{position:relative;min-width:0;}
.profile-input{
  width:100%;height:48px;border-radius:7px;border:1px solid rgba(216,180,254,.30);
  background:linear-gradient(180deg,rgba(7,7,14,.86),rgba(3,3,8,.92));
  color:#fff;outline:none;padding:0 16px;font-size:16px;font-weight:1000;letter-spacing:-.2px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.36);transition:.18s;
}
.profile-input:focus{border-color:rgba(216,180,254,.86);box-shadow:0 0 0 1px rgba(168,85,247,.22),0 0 22px rgba(168,85,247,.28),inset 0 0 18px rgba(168,85,247,.06);}
.profile-input::placeholder{color:rgba(255,255,255,.36);font-weight:900;}
.check-btn{
  height:48px;border-radius:7px;border:1px solid rgba(216,180,254,.48);
  background:linear-gradient(180deg,rgba(126,68,255,.42),rgba(56,28,112,.56));
  color:#fff;font-size:13px;font-weight:1000;letter-spacing:.2px;cursor:pointer;
  box-shadow:0 0 16px rgba(168,85,247,.28),inset 0 0 16px rgba(255,255,255,.045);transition:.18s;
}
.check-btn:hover{transform:translateY(-1px);border-color:rgba(255,255,255,.70);box-shadow:0 0 24px rgba(168,85,247,.45),inset 0 0 18px rgba(255,255,255,.06);}
.field-msg{grid-column:2 / -1;min-height:16px;margin:-2px 0 0;padding:0 4px;font-size:12px;font-weight:900;color:rgba(233,213,255,.62);line-height:1.25;}
.field-msg.ok{color:#d8c8ff;text-shadow:0 0 10px rgba(168,85,247,.45);}
.field-msg.bad{color:#fca5a5;text-shadow:0 0 10px rgba(248,113,113,.25);}
.action-row{margin-top:22px !important;}
.action-row .btn,.save-btn{height:54px !important;border-radius:9px !important;}
.notice{margin-top:16px !important;padding:16px 18px !important;border-radius:9px !important;}
@media (max-width:700px){
  .profile-field,.profile-field.is-single{grid-template-columns:1fr;gap:8px;padding:12px;}
  .profile-label{height:auto;padding:0 4px;}
  .field-msg{grid-column:1 / -1;}
  .check-btn{width:100%;}
}



.withdraw-btn{
  background:linear-gradient(180deg,#ff4747,#c40000);
  border:1px solid rgba(255,120,120,.45);
  color:#fff;
  box-shadow:
    0 0 12px rgba(255,0,0,.28),
    inset 0 1px 0 rgba(255,255,255,.14);
}

.withdraw-btn:hover{
  transform:translateY(-1px);

    0 0 18px rgba(255,0,0,.42),

.withdraw-btn:active{

async function withdrawAccount(){

  const ok = confirm(
    "정말 회원탈퇴 하시겠습니까?\n\n모든 정보가 삭제됩니다."
  );

  if(!ok) return;

  try{

    const loginKeys = [
      "pklLoginUser",
      "pklCurrentUser",
      "discordUser",
      "loginUser"
    ];

    const adminKey = "pklAdminState_v3";

    const loginUser =
      JSON.parse(localStorage.getItem("pklLoginUser") || "null") ||
      JSON.parse(localStorage.getItem("pklCurrentUser") || "null") ||
      JSON.parse(localStorage.getItem("discordUser") || "null");

    const users =
      [] /* pklUsers local restore blocked */;

    const filtered = users.filter(user=>{
      if(!loginUser) return true;

      const a = String(user?.discordId || "").trim();
      const b = String(loginUser?.discordId || "").trim();

      return a !== b;
    });

    /* pklUsers local write blocked */

    const adminState =
      JSON.parse(localStorage.getItem(adminKey) || "{}");

    if(Array.isArray(adminState.users)){

      adminState.users = adminState.users.filter(user=>{

        const a = String(user?.discordId || "").trim();
        const b = String(loginUser?.discordId || "").trim();

        return a !== b;
      });

      localStorage.setItem(
        adminKey,
        JSON.stringify(adminState)
      );
    }

    loginKeys.forEach(key=>{
      localStorage.removeItem(key);
    });

    alert("회원탈퇴가 완료되었습니다.");

    location.href = "index.html";

  }catch(error){

    console.error(error);

    alert("회원탈퇴 처리 중 오류가 발생했습니다.");
  }
}

<script>
const PKL_ADMIN_STATE_KEY = "pklAdminState_v3";
const PKL_LOGIN_KEYS = ["pklLoginUser","pklCurrentUser","pklUser","pklLoggedInUser","pkl_current_user"];
let originalUser = null;
let nicknameCheckedValue = "";

function safeParse(raw, fallback){
  try{return JSON.parse(raw || "");}catch(e){return fallback;}
}

function getUsers(){
  /* Supabase 단일 원본: 내정보에서 pklUsers localStorage 복원 금지. */
  try{ if(window.PKLUsersSource && typeof window.PKLUsersSource.localUsers === "function") return window.PKLUsersSource.localUsers(); }catch(e){}
  return [];
}

function saveUsers(users){
  /* pklUsers/PKL_USERS localStorage 저장 금지. 개별 저장은 /api/pkl-users 또는 PKLUsersSource.saveUser만 사용. */
  const arr = Array.isArray(users) ? users : [];
  try{ if(window.PKLUsersSource && typeof window.PKLUsersSource.saveUser === "function") arr.forEach(u=>window.PKLUsersSource.saveUser(u)); }catch(e){}
}

function getLoginUser(){
  for(const key of PKL_LOGIN_KEYS){
    const user = safeParse(localStorage.getItem(key), null);
    if(user && typeof user === "object") return user;
  }
  return null;
}

function sameUser(a,b){
  if(!a || !b) return false;
  const auid = String(a.uid || a.id || "");
  const buid = String(b.uid || b.id || "");
  if(auid && buid && auid === buid) return true;
  const anick = String(a.nickname || a.nick || a.name || "");
  const bnick = String(b.nickname || b.nick || b.name || "");
  const apubg = String(a.pubgId || a.gameId || a.ref || "");
  const bpubg = String(b.pubgId || b.gameId || b.ref || "");
  return !!((anick && bnick && anick === bnick) || (apubg && bpubg && apubg === bpubg));
}

function setEveryLoginUser(user){
  PKL_LOGIN_KEYS.forEach(key=>{
    try{
      const cur = safeParse(localStorage.getItem(key), null);
      if(cur && typeof cur === "object" && sameUser(cur, originalUser || user)){
        localStorage.setItem(key, JSON.stringify({...cur, ...user, nickname:user.nickname, nick:user.nickname, name:user.nickname, pubgId:user.pubgId, gameId:user.pubgId}));
      }
    }catch(e){}
  });
  localStorage.setItem("pklLoginUser", JSON.stringify(user));
}

function cleanPubgInput(value){
  return String(value || "").replace(/[^A-Za-z0-9_-]/g, "");
}

function setMsg(id, text, type){
  const el = document.getElementById(id);
  if(!el) return;
  el.textContent = text || "";
  el.classList.remove("ok","bad");
  if(type) el.classList.add(type);
}

function clearMessages(){
  ["errorMsg","successMsg"].forEach(id=>{
    const el=document.getElementById(id);
    if(!el)return;
    el.textContent="";
    el.classList.remove("active");
  });
}

function showError(text){
  const el=document.getElementById("errorMsg");
  if(el){el.textContent=text;el.classList.add("active");}
}

function showSuccess(text){
  const el=document.getElementById("successMsg");
  if(el){el.textContent=text;el.classList.add("active");}
}

function nicknameExists(nickname){
  const target = String(nickname || "").trim();
  if(!target) return false;
  const users = getUsers();
  const inUsers = users.some(u => {
    if(sameUser(u, originalUser)) return false;
    return String(u.nickname || u.nick || u.name || "") === target;
  });
  const adminState = safeParse(localStorage.getItem(PKL_ADMIN_STATE_KEY), null);
  const adminUsers = Array.isArray(adminState?.users) ? adminState.users : [];
  const inAdmin = adminUsers.some(u => {
    if(sameUser(u, originalUser)) return false;
    return String(u.nickname || u.nick || u.name || "") === target;
  });
  return inUsers || inAdmin;
}

function checkNicknameDuplicate(){
  clearMessages();
  const nickname = document.getElementById("nicknameInput").value.trim();
  if(!nickname){setMsg("nicknameMsg","닉네임을 입력해주세요.","bad"); return false;}
  if(originalUser && nickname === String(originalUser.nickname || originalUser.nick || originalUser.name || "")){
    nicknameCheckedValue = nickname;
    setMsg("nicknameMsg","현재 사용 중인 닉네임입니다.","ok");
    return true;
  }
  if(nicknameExists(nickname)){
    nicknameCheckedValue = "";
    setMsg("nicknameMsg","이미 사용 중인 닉네임입니다.","bad");
    return false;
  }
  nicknameCheckedValue = nickname;
  setMsg("nicknameMsg","사용 가능한 닉네임입니다.","ok");
  return true;
}

function updateAdminStorage(updatedUser){
  /* 유저 프로필은 pklUsers 한 곳만 저장한다. pklAdminState_v3.users 복원 흐름 차단. */
}

function updateAccountStorage(updatedUser){
  const users = getUsers();
  let idx = users.findIndex(u => sameUser(u, originalUser));
  if(idx < 0 && originalUser){
    idx = users.findIndex(u => String(u.nickname || u.nick || u.name || "") === String(originalUser.nickname || originalUser.nick || originalUser.name || ""));
  }
  if(idx >= 0){
    users[idx] = {
      ...users[idx],

  function clean(v){return String(v==null?"":v).trim();}
  function idOf(u){u=u||{};return clean(u.discordId||u.uid||u.id||u.userId||u.key).toLowerCase();}
  function nickOf(u){u=u||{};return clean(u.nickname||u.nick||u.name||u.displayName);}
  function pubgOf(u){u=u||{};return clean(u.pubgId||u.gameId||u.ref||u.pubgName);}
  function same(a,b){const ai=idOf(a),bi=idOf(b);if(ai&&bi)return ai===bi;const ap=pubgOf(a).toLowerCase(),bp=pubgOf(b).toLowerCase();if(ap&&bp)return ap===bp;const an=nickOf(a).toLowerCase(),bn=nickOf(b).toLowerCase();return !!(an&&bn&&an===bn);}
  function getLogin(){for(const k of LOGIN_KEYS){const u=parseKey(k,null);if(u&&typeof u==='object')return u;}return null;}
  function nowText(){return new Date().toLocaleString('ko-KR',{timeZone:'Asia/Seoul',hour12:false});}
  function addDaysIso(days){return new Date(Date.now()+days*86400000).toISOString();}
  function ensureModal(){
    if(document.getElementById('pklWithdrawRedModal')) return;
    const css=document.createElement('style');
    css.textContent=`
      #pklWithdrawRedModal{display:none;position:fixed;inset:0;z-index:2147483647;background:rgba(0,0,0,.78);backdrop-filter:blur(10px);align-items:center;justify-content:center;font-family:Pretendard,'Noto Sans KR','Malgun Gothic',sans-serif}
      #pklWithdrawRedModal.open{display:flex}
      .pkl-red-withdraw-card{width:min(500px,calc(100vw - 34px));border:1px solid rgba(255,77,100,.82);border-radius:22px;background:radial-gradient(circle at 50% -18%,rgba(255,77,100,.30),transparent 44%),linear-gradient(180deg,rgba(34,8,17,.98),rgba(8,6,12,.98));box-shadow:0 0 44px rgba(255,77,100,.38),0 28px 80px rgba(0,0,0,.68);padding:26px;text-align:center;color:#fff}
      .pkl-red-withdraw-card .k{color:#ff9aaa;font-size:12px;font-weight:1000;letter-spacing:2.2px;margin-bottom:10px}.pkl-red-withdraw-card h2{margin:0 0 12px;font-size:25px;font-weight:1000}.pkl-red-withdraw-card p{margin:0;color:#ffd6dc;font-size:14px;font-weight:900;line-height:1.7}.pkl-red-withdraw-card .warn{margin-top:15px;padding:14px;border-radius:15px;border:1px solid rgba(255,77,100,.44);background:rgba(255,77,100,.15);color:#fff;font-weight:1000;line-height:1.55}.pkl-red-withdraw-actions{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:19px}.pkl-red-withdraw-actions button{height:46px;border-radius:13px;border:1px solid rgba(255,255,255,.14);color:#fff;font-weight:1000;cursor:pointer}.pkl-red-withdraw-cancel{background:rgba(255,255,255,.08)}.pkl-red-withdraw-ok{background:linear-gradient(180deg,rgba(255,77,100,.92),rgba(132,14,35,.96));border-color:rgba(255,77,100,.80)!important;box-shadow:0 0 18px rgba(255,77,100,.22)}
    `;
    document.head.appendChild(css);
    const div=document.createElement('div');
    div.id='pklWithdrawRedModal';
    div.innerHTML=`<div class="pkl-red-withdraw-card" role="dialog" aria-modal="true"><div class="k">PKL ACCOUNT WITHDRAWAL</div><h2>회원탈퇴 안내</h2><p>회원탈퇴를 진행하면 현재 계정 정보가 삭제됩니다.</p><div class="warn">회원 탈퇴하면 <b>30일간 다시 회원가입할 수 없습니다.</b><br>탈퇴 기록은 추방기록에 등록되며, 30일 후 자동 제외됩니다.</div><div class="pkl-red-withdraw-actions"><button type="button" class="pkl-red-withdraw-cancel">취소</button><button type="button" class="pkl-red-withdraw-ok">회원탈퇴</button></div></div>`;
    document.body.appendChild(div);
  }
  function confirmWithdraw(){
    ensureModal();
    return new Promise(resolve=>{
      const m=document.getElementById('pklWithdrawRedModal');
      const ok=m.querySelector('.pkl-red-withdraw-ok');
      const cancel=m.querySelector('.pkl-red-withdraw-cancel');
      function done(v){m.classList.remove('open');ok.onclick=cancel.onclick=null;resolve(v);}
      ok.onclick=()=>done(true); cancel.onclick=()=>done(false);
      m.classList.add('open');
    });
  }
  async function syncShared(key,val){try{if(window.PKLSupabaseDataSync&&window.PKLSupabaseDataSync.setShared)await window.PKLSupabaseDataSync.setShared(key,val);}catch(e){}}
  async function realWithdraw(){
    const ok=await confirmWithdraw(); if(!ok) return;
    const login=getLogin(); if(!login){location.href='login.html';return;}
    const date=nowText(); const createdAt=new Date().toISOString(); const expiresAt=addDaysIso(30);
    const ban={type:'selfWithdraw',selfWithdrawal:true,nickname:nickOf(login)||'-',pubgId:pubgOf(login)||'',discordId:login.discordId||'',uid:login.uid||login.id||'',reason:'본인 회원탈퇴 · 30일 재가입 제한',date,createdAt,expiresAt,admin:'SELF'};
    const users=([] /* pklUsers local restore blocked */||[]).filter(u=>!same(u,login));
    /* pklUsers localStorage write blocked */
    const st=parseKey('pklAdminState_v3',{users:[],pending:[],bans:[],warningRecords:[],memberEvents:[]});
    st.users=Array.isArray(st.users)?st.users.filter(u=>!same(u,login)):[];
    st.pending=Array.isArray(st.pending)?st.pending.filter(u=>!same(u,login)):[];
    st.bans=Array.isArray(st.bans)?st.bans:[];
    if(!st.bans.some(b=>same(b,login))) st.bans.unshift(ban);
    st.memberEvents=Array.isArray(st.memberEvents)?st.memberEvents:[];
    st.memberEvents.unshift({type:'withdraw',nickname:ban.nickname,pubgId:ban.pubgId,discordId:ban.discordId,uid:ban.uid,date,createdAt,source:'myinfo'});
    setKey('pklAdminState_v3',st);
    const banned=parseKey('pklBannedUsers',[]);
    if(Array.isArray(banned)&&!banned.some(b=>same(b,login))){banned.unshift(ban);setKey('pklBannedUsers',banned);/* pklBannedUsers local restore sync blocked */}
    /* Supabase users/admin state local restore sync blocked. */
    LOGIN_KEYS.forEach(k=>{try{localStorage.removeItem(k);sessionStorage.removeItem(k);}catch(e){}});
    alert('회원탈퇴가 완료되었습니다. 30일간 재가입할 수 없습니다.');
    location.href='index.html';
  }
  window.withdrawAccount = realWithdraw;
  document.addEventListener('click', function(e){
    const btn=e.target&&e.target.closest&&e.target.closest('.withdraw-btn,[onclick*="withdrawAccount"],[data-withdraw-account]');
    if(!btn) return;
    e.preventDefault(); e.stopPropagation(); if(e.stopImmediatePropagation) e.stopImmediatePropagation();
    realWithdraw();
  }, true);
})();
</script>
