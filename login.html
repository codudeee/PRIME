<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8" />
<title>PKL 로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05050a;color:#f8fafc;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}

body{
  min-height:100vh;
  overflow:hidden;
}

.login-page{
  position:relative;
  width:100%;
  min-height:100vh;
  isolation:isolate;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:120px 24px 54px;
}

.login-page::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("pkl_join_bg.webp") center/cover no-repeat;
  z-index:-3;
  transform:scale(1.01);
}

.login-page::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 52%,rgba(168,85,247,.12),transparent 28%),
    linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.14) 38%,rgba(0,0,0,.58));
  z-index:-2;
}

.login-shell{
  width:min(520px,92vw);
  margin-top:184px;
  position:relative;
}

.login-shell::before{
  content:"";
  position:absolute;
  left:50%;
  top:-14px;
  width:70%;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#9d5cff,#efe7ff,#9d5cff,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.9),0 0 42px rgba(168,85,247,.42);
}

.login-card{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  border:1px solid rgba(210,183,255,.34);
  background:
    linear-gradient(180deg,rgba(9,9,18,.78),rgba(5,5,11,.86)),
    rgba(8,7,15,.82);
  box-shadow:
    0 28px 80px rgba(0,0,0,.58),
    0 0 38px rgba(168,85,247,.18),
    inset 0 0 42px rgba(255,255,255,.025);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:46px 52px 40px;
}

.login-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.18),transparent 32%),
    linear-gradient(120deg,transparent 0%,rgba(255,255,255,.045) 45%,transparent 70%);
  pointer-events:none;
}

.login-card::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#a855f7,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.8);
}

.login-title{
  position:relative;
  margin:0 0 34px;
  text-align:center;
  font-size:34px;
  line-height:1;
  letter-spacing:8px;
  font-weight:1000;
  color:#f7f2ff;
  text-shadow:0 0 16px rgba(168,85,247,.72),0 0 34px rgba(168,85,247,.24);
}

.login-title::before,
.login-title::after{
  content:"";
  position:absolute;
  top:50%;
  width:84px;
  height:1px;
  background:linear-gradient(90deg,transparent,#7c3cff);
  box-shadow:0 0 10px rgba(124,60,255,.72);
}
.login-title::before{right:calc(50% + 88px)}
.login-title::after{left:calc(50% + 80px);transform:scaleX(-1)}

.form{
  position:relative;
  display:grid;
  gap:18px;
}

.input-wrap{
  position:relative;
}

.input-icon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  color:#c4b5fd;
  font-size:20px;
  opacity:.92;
  text-shadow:0 0 12px rgba(168,85,247,.48);
  pointer-events:none;
}

.input-wrap input{
  width:100%;
  height:54px;
  border-radius:6px;
  border:1px solid rgba(196,181,253,.32);
  background:rgba(4,4,10,.64);
  color:#fff;
  outline:none;
  padding:0 18px 0 58px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.24);
  transition:.18s;
}

.input-wrap input::placeholder{
  color:rgba(255,255,255,.45);
  font-weight:900;
  letter-spacing:.6px;
}

.input-wrap input:focus{
  border-color:rgba(168,85,247,.86);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.18),
    0 0 22px rgba(168,85,247,.24),
    inset 0 0 18px rgba(168,85,247,.045);
}

.login-btn{
  height:62px;
  margin-top:10px;
  border-radius:7px;
  border:1px solid rgba(208,178,255,.58);
  background:
    linear-gradient(180deg,rgba(126,68,255,.32),rgba(66,31,132,.34)),
    rgba(10,7,20,.72);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  letter-spacing:.7px;
  cursor:pointer;
  box-shadow:
    0 0 20px rgba(168,85,247,.42),
    inset 0 0 24px rgba(168,85,247,.12);
  transition:.18s;
}

.login-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(233,213,255,.88);
  box-shadow:
    0 0 28px rgba(168,85,247,.58),
    0 14px 34px rgba(0,0,0,.28),
    inset 0 0 26px rgba(168,85,247,.18);
}

.divider{
  display:flex;
  align-items:center;
  gap:18px;
  margin:20px 0 4px;
  color:rgba(255,255,255,.62);
  font-size:13px;
  font-weight:1000;
  letter-spacing:1px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(196,181,253,.34));
}
.divider::after{transform:scaleX(-1)}

.login-links{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  align-items:center;
  gap:20px;
  margin-top:8px;
}

.login-links::before{
  content:"";
  width:1px;
  height:30px;
  background:rgba(196,181,253,.18);
  grid-column:2;
  grid-row:1;
}

.login-links a{
  font-size:14px;
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(233,213,255,.78);
  font-size:14px;
  font-weight:1000;
  letter-spacing:.2px;
  transition:.18s;
}

.login-links a:hover{
  color:#fff;
  text-shadow:0 0 14px rgba(168,85,247,.82);
}

.login-links a:first-child{grid-column:1}
.login-links a:last-child{grid-column:3}


.back-home{
  position:fixed;
  left:28px;
  top:24px;
  z-index:99999;
  min-width:120px;
  height:46px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  border:1px solid rgba(168,85,247,.65);
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.55),transparent 55%),
    linear-gradient(180deg,rgba(22,14,48,.95),rgba(6,6,14,.98));
  color:#ffffff;
  font-size:14px;
  font-weight:1000;
  letter-spacing:.6px;
  text-shadow:0 0 16px rgba(168,85,247,1);
  box-shadow:
    0 0 28px rgba(168,85,247,.6),
    0 18px 40px rgba(0,0,0,.45),
    inset 0 0 18px rgba(255,255,255,.06);
}


.back-home:hover{
  color:#fff;
  border-color:rgba(168,85,247,.72);
  box-shadow:0 0 18px rgba(168,85,247,.25);
}

.error-msg{
  min-height:18px;
  margin:2px 0 0;
  color:#fca5a5;
  font-size:13px;
  font-weight:900;
  text-align:center;
}

@media (max-height:840px){
  .login-page{padding-top:88px}
  .login-shell{margin-top:132px}
  .login-card{padding:38px 46px 34px}
}

@media (max-width:700px){

<script>
(function(){
  var LOGIN_KEYS=["discordUser","pklLoginUser","pklCurrentUser","pklUser","pklLoggedInUser","pkl_current_user"];
  var LOGOUT_KEY="pklManualLogout";
  function readPersistedUser(){
    try{ if(localStorage.getItem(LOGOUT_KEY)==="1") return null; }catch(e){}
    for(var i=0;i<LOGIN_KEYS.length;i++){
      try{
        var raw=localStorage.getItem(LOGIN_KEYS[i]) || sessionStorage.getItem(LOGIN_KEYS[i]);
        if(!raw) continue;
        var user=JSON.parse(raw);
        if(user && typeof user==="object"){
          return user;
        }
      }catch(e){}
    }
    return null;
  }
  function syncPklLoginDropdownState(){
    var user=readPersistedUser();
    if(user){ location.replace("index.html"); return; }
    if(document.body){
      document.body.classList.toggle("pkl-logged-in", !!user);
      document.body.classList.toggle("pkl-logged-out", !user);
    }
  }
  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded", syncPklLoginDropdownState);
  }else{
    syncPklLoginDropdownState();
  }
  window.addEventListener("storage", syncPklLoginDropdownState);
})();
</script>

<script id="pkl-global-stacked-modal-layer-script">
(function(){
  if(window.__PKL_STACKED_MODAL_LAYER_FINAL__) return;
  window.__PKL_STACKED_MODAL_LAYER_FINAL__=true;
  var BASE=2147481000;
  var step=0;
  var modalSelector=[
    '.modal',
    '.edit-modal',
    '.member-edit-modal',
    '.temp-edit-modal',
    '.pkl-notice-layer',
    '.pkl-result-admin-modal',
    '.pkl-delete-confirm-modal',
    '#resultAdminModal',
    '#resultDeleteConfirmModal'
  ].join(',');
  function isOpen(el){
    if(!el || !el.classList) return false;
    var cs;
    try{cs=getComputedStyle(el);}catch(e){cs=null;}
    return el.classList.contains('open') ||
      el.getAttribute('aria-hidden')==='false' ||
      (cs && cs.position==='fixed' && cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0');
  }
  function setLayer(el,z){
    if(!el || !el.style) return;
    el.classList.add('pkl-layer-managed-modal');
    el.style.setProperty('z-index', String(z), 'important');
    el.style.setProperty('pointer-events', 'auto', 'important');
    var kids=el.querySelectorAll(':scope > *, [role="dialog"], .modal-box, .modal-card, .pkl-result-admin-panel, .pkl-delete-confirm-box, .pkl-notice-card, .temp-edit-box');
    kids.forEach(function(k){
      k.style.setProperty('z-index', String(z+1), 'important');
      k.style.setProperty('pointer-events','auto','important');
      if(getComputedStyle(k).position==='static') k.style.setProperty('position','relative','important');
    });
  }
  function bring(el){
    if(!el) return;
    step+=10;
    setLayer(el,BASE+step);
  }
  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(modalSelector),function(el){
      if(isOpen(el) && !el.dataset.pklLayerNoAuto){
        if(!el.dataset.pklLayerOrder){
          el.dataset.pklLayerOrder=String(++step);
        }
        setLayer(el,BASE+Number(el.dataset.pklLayerOrder));
      }else if(el && el.dataset){
        delete el.dataset.pklLayerOrder;
      }
    });
  }
  window.PKLBringModalToFront=function(el){
    if(typeof el==='string') el=document.querySelector(el);
    if(el){ delete el.dataset.pklLayerOrder; bring(el); }
  };
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest && e.target.closest(modalSelector);
    if(el) window.PKLBringModalToFront(el);
    setTimeout(scan,0);
    setTimeout(scan,80);
  },true);
  var mo=new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target;
      if(el && el.matches && el.matches(modalSelector) && isOpen(el)) window.PKLBringModalToFront(el);
    });
    setTimeout(scan,0);
  });
  function boot(){
    try{mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden']});}catch(e){}
    scan();
    
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
