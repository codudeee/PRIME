<!DOCTYPE html>
<html lang="ko">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<meta charset="utf-8" />
<title>PKL 로그인</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:#05050a;color:#f8fafc;font-family:'Malgun Gothic','Apple SD Gothic Neo','Noto Sans KR','Segoe UI',sans-serif}
a{text-decoration:none;color:inherit}
button,input{font-family:inherit}

body{
  min-height:100vh;
  overflow-x:hidden;
  overflow-y:auto;
}

.join-page{
  position:relative;
  width:100%;
  min-height:100vh;
  isolation:isolate;
  display:flex;
  align-items:flex-start;
  justify-content:center;
  padding:120px 24px 80px;
}

.join-page::before{
  content:"";
  position:fixed;
  inset:0;
  background:url("login_bg.webp") center/cover no-repeat;
  z-index:-3;
  transform:scale(1.01);
}

.join-page::after{
  content:"";
  position:fixed;
  inset:0;
  background:
    radial-gradient(circle at 50% 52%,rgba(168,85,247,.14),transparent 29%),
    linear-gradient(180deg,rgba(0,0,0,.06),rgba(0,0,0,.15) 38%,rgba(0,0,0,.60));
  z-index:-2;
}

.join-shell{
  width:min(560px,92vw);
  margin-top:150px;
  position:relative;
}

.join-shell::before{
  content:"";
  position:absolute;
  left:50%;
  top:-14px;
  width:70%;
  height:2px;
  transform:translateX(-50%);
  background:linear-gradient(90deg,transparent,#9d5cff,#efe7ff,#9d5cff,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.9),0 0 42px rgba(168,85,247,.42);
}

.join-card{
  position:relative;
  overflow:hidden;
  border-radius:12px;
  border:1px solid rgba(210,183,255,.34);
  background:
    linear-gradient(180deg,rgba(9,9,18,.78),rgba(5,5,11,.88)),
    rgba(8,7,15,.82);
  box-shadow:
    0 28px 80px rgba(0,0,0,.58),
    0 0 38px rgba(168,85,247,.18),
    inset 0 0 42px rgba(255,255,255,.025);
  backdrop-filter:blur(14px);
  -webkit-backdrop-filter:blur(14px);
  padding:44px 52px 38px;
}

.join-card::before{
  content:"";
  position:absolute;
  inset:0;
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.18),transparent 32%),
    linear-gradient(120deg,transparent 0%,rgba(255,255,255,.045) 45%,transparent 70%);
  pointer-events:none;
}

.join-card::after{
  content:"";
  position:absolute;
  left:20%;
  right:20%;
  bottom:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#a855f7,transparent);
  box-shadow:0 0 18px rgba(168,85,247,.8);
}

.join-title{
  position:relative;
  margin:0 0 10px;
  text-align:center;
  font-size:34px;
  line-height:1;
  letter-spacing:8px;
  font-weight:1000;
  color:#f7f2ff;
  text-shadow:0 0 16px rgba(168,85,247,.72),0 0 34px rgba(168,85,247,.24);
}

.join-sub{
  margin:0 0 30px;
  text-align:center;
  font-size:13px;
  font-weight:900;
  letter-spacing:.6px;
  color:rgba(233,213,255,.64);
}


.join-rule-box{
  position:relative;
  margin:-12px 0 24px;
  padding:14px 16px;
  border-radius:7px;
  border:1px solid rgba(168,85,247,.26);
  background:rgba(4,4,10,.54);
  color:rgba(255,255,255,.72);
  font-size:12px;
  line-height:1.68;
  font-weight:900;
  text-align:left;
  word-break:keep-all;
  box-shadow:inset 0 0 18px rgba(168,85,247,.035);
}

.form{
  position:relative;
  display:grid;
  gap:15px;
}

.input-wrap{
  position:relative;
}

.nickname-wrap input{
  padding-right:150px;
}
.input-hint{
  position:absolute;
  right:18px;
  top:50%;
  transform:translateY(-50%);
  display:none;
  color:#fca5a5;
  font-size:12px;
  font-weight:1000;
  letter-spacing:-.2px;
  text-align:right;
  pointer-events:none;
  text-shadow:0 0 12px rgba(239,68,68,.34);
}

.pubg-wrap input{
  padding-right:260px;
}
.pubg-hint{
  display:block;
}

.input-hint.show{
  display:block;
}


.input-icon{
  position:absolute;
  left:20px;
  top:50%;
  transform:translateY(-50%);
  color:#c4b5fd;
  font-size:20px;
  opacity:.92;
  text-shadow:0 0 12px rgba(168,85,247,.48);
  pointer-events:none;
}

.input-wrap input{
  width:100%;
  height:52px;
  border-radius:6px;
  border:1px solid rgba(196,181,253,.32);
  background:rgba(4,4,10,.64);
  color:#fff;
  outline:none;
  padding:0 18px 0 58px;
  font-size:15px;
  font-weight:900;
  letter-spacing:.3px;
  box-shadow:inset 0 0 18px rgba(0,0,0,.24);
  transition:.18s;
}

.input-wrap input::placeholder{
  color:rgba(255,255,255,.45);
  font-weight:900;
  letter-spacing:.6px;
}

.input-wrap input:focus{
  border-color:rgba(168,85,247,.86);
  box-shadow:
    0 0 0 1px rgba(168,85,247,.18),
    0 0 22px rgba(168,85,247,.24),
    inset 0 0 18px rgba(168,85,247,.045);
}

.join-btn{
  height:60px;
  margin-top:8px;
  border-radius:7px;
  border:1px solid rgba(208,178,255,.58);
  background:
    linear-gradient(180deg,rgba(126,68,255,.34),rgba(66,31,132,.36)),
    rgba(10,7,20,.72);
  color:#fff;
  font-size:18px;
  font-weight:1000;
  letter-spacing:.7px;
  cursor:pointer;
  box-shadow:
    0 0 20px rgba(168,85,247,.42),
    inset 0 0 24px rgba(168,85,247,.12);
  transition:.18s;
}

.join-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(233,213,255,.88);
  box-shadow:
    0 0 28px rgba(168,85,247,.58),
    0 14px 34px rgba(0,0,0,.28),
    inset 0 0 26px rgba(168,85,247,.18);
}

.notice{
  margin:16px 0 0;
  padding:13px 15px;
  border:1px solid rgba(168,85,247,.22);
  border-radius:7px;
  background:rgba(168,85,247,.055);
  color:rgba(255,255,255,.62);
  font-size:12px;
  line-height:1.6;
  font-weight:800;
  word-break:keep-all;
}

.divider{
  display:flex;
  align-items:center;
  gap:18px;
  margin:18px 0 4px;
  color:rgba(255,255,255,.62);
  font-size:13px;
  font-weight:1000;
  letter-spacing:1px;
}

.divider::before,
.divider::after{
  content:"";
  flex:1;
  height:1px;
  background:linear-gradient(90deg,transparent,rgba(196,181,253,.34));
}
.divider::after{transform:scaleX(-1)}

.join-links{
  display:grid;
  grid-template-columns:1fr 1px 1fr;
  align-items:center;
  gap:20px;
  margin-top:8px;
}

.join-links::before{
  content:"";
  width:1px;
  height:30px;
  background:rgba(196,181,253,.18);
  grid-column:2;
  grid-row:1;
}

.join-links a{
  height:42px;
  display:flex;
  align-items:center;
  justify-content:center;
  color:rgba(233,213,255,.78);
  font-size:14px;
  font-weight:1000;
  letter-spacing:.2px;
  transition:.18s;
}

.join-links a:hover{
  color:#fff;
  text-shadow:0 0 14px rgba(168,85,247,.82);
}

.join-links a:first-child{grid-column:1}
.join-links a:last-child{grid-column:3}


.back-home{
  position:fixed;
  left:28px;
  top:24px;
  z-index:99999;
  min-width:120px;
  height:46px;
  padding:0 20px;
  display:flex;
  align-items:center;
  justify-content:center;
  border-radius:14px;
  border:1px solid rgba(168,85,247,.65);
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.55),transparent 55%),
    linear-gradient(180deg,rgba(22,14,48,.95),rgba(6,6,14,.98));
  color:#ffffff;
  font-size:14px;
  font-weight:1000;
  letter-spacing:.6px;
  text-shadow:0 0 16px rgba(168,85,247,1);
  box-shadow:
    0 0 28px rgba(168,85,247,.6),
    0 18px 40px rgba(0,0,0,.45),
    inset 0 0 18px rgba(255,255,255,.06);
}


.back-home:hover{
  color:#fff;
  border-color:rgba(168,85,247,.72);
  box-shadow:0 0 18px rgba(168,85,247,.25);
}

.error-msg{
  min-height:18px;
  margin:2px 0 0;
  color:#fca5a5;
  font-size:13px;
  font-weight:900;
  text-align:center;
}

.success-msg{
  min-height:18px;
  margin:2px 0 0;
  color:#c4b5fd;
  font-size:13px;
  font-weight:900;
  text-align:center;
}

@media (max-height:900px){
  body{overflow:auto}
  .join-page{padding-top:86px;padding-bottom:80px}
  .join-shell{margin-top:118px}
  .join-card{padding:36px 46px 32px}
  .input-wrap input{height:48px}
}

@media (max-width:700px){
  body{overflow:auto}
  .join-page{padding:86px 16px 36px}
  .join-shell{margin-top:120px}
  .join-card{padding:34px 24px 30px}
  .join-title{font-size:28px;letter-spacing:6px}

  position:fixed;
  left:28px;
  top:24px;
  z-index:99999;

  display:flex;
  align-items:center;
  justify-content:center;

  color:#ffffff;
  font-size:14px;
  font-weight:1000;
  letter-spacing:.6px;
  text-shadow:0 0 16px rgba(168,85,247,1);

    0 0 28px rgba(168,85,247,.6),

    inset 0 0 18px rgba(255,255,255,.06);
}

}

.discord-btn{
  height:64px;
  width:100%;
  border-radius:8px;
  border:1px solid rgba(196,181,253,.55);
  background:linear-gradient(180deg,rgba(88,101,242,.42),rgba(28,26,56,.76));
  color:#fff;
  font-size:18px;
  font-weight:1000;
  letter-spacing:.4px;
  cursor:pointer;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  box-shadow:0 0 26px rgba(88,101,242,.32), inset 0 0 24px rgba(168,85,247,.10);
  transition:.18s;
}
.discord-btn:hover{
  transform:translateY(-2px);
  border-color:rgba(233,213,255,.9);
  box-shadow:0 0 34px rgba(88,101,242,.48),0 14px 34px rgba(0,0,0,.28),inset 0 0 26px rgba(168,85,247,.18);
}
.discord-note{
  margin:16px 0 0;

</style>

<body>
<a class="back-home" onclick="history.back()">← 뒤로가기</a>

<main class="join-page">
  <section class="join-shell" aria-label="PKL Discord 가입">
    <div class="join-card">
      <h1 class="join-title">LOGIN</h1>
      <p class="join-sub">PRIME KILL LEAGUE LOGIN</p>
      <div class="join-rule-box">
        기존 아이디/비밀번호 로그인은 사용하지 않습니다.<br>
        Discord 계정 인증 한 번으로 PKL 계정이 자동 생성됩니다.<br>
        Discord 인증으로 PKL 계정에 로그인합니다.
      </div>
      <div class="form">
        <button class="discord-btn" type="button" onclick="location.href='/api/discord-login'">
          Discord로 로그인
        </button>
        <p class="success-msg">Discord 인증 후 자동으로 메인 화면으로 이동합니다.</p>
      </div>
      <div class="divider">PKL AUTH</div>
      <div class="join-links">
        <a href="register.html">가입 화면</a>
        <a href="contact.html">관리자문의</a>
      </div>
    </div>
  </section>
</main>

<script>
function checkAdminAccess(role){
  if(role !== '관리자' && role !== '운영자'){
    var modal=document.getElementById('authBlockModal');
    if(modal) modal.style.display='flex';
    return false;
  }
  return true;
}
</script>
<div id="authBlockModal" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.6); z-index:9999; align-items:center; justify-content:center;">
  <div style="position:relative; width:320px; background:#111; border:1px solid #6a00ff; box-shadow:0 0 20px #6a00ff; border-radius:8px; padding:20px; text-align:center; color:#fff;">
    <div onclick="document.getElementById('authBlockModal').style.display='none'" style="position:absolute; top:10px; right:10px; cursor:pointer;">✕</div>

<!-- PKL global stacked modal layer manager -->
<style id="pkl-global-stacked-modal-layer-style">
  .pkl-layer-managed-modal{
    position:fixed !important;
    pointer-events:auto !important;
  }
  .pkl-layer-managed-modal > *,
  .pkl-layer-managed-modal [role="dialog"],
  .pkl-layer-managed-modal .modal-box,
  .pkl-layer-managed-modal .modal-card,
  .pkl-layer-managed-modal .pkl-result-admin-panel,
  .pkl-layer-managed-modal .pkl-delete-confirm-box,
  .pkl-layer-managed-modal .pkl-notice-card,
  .pkl-layer-managed-modal .temp-edit-box{
    position:relative !important;
    pointer-events:auto !important;
  }
</style>
<script id="pkl-global-stacked-modal-layer-script">
(function(){
  if(window.__PKL_STACKED_MODAL_LAYER_FINAL__) return;
  window.__PKL_STACKED_MODAL_LAYER_FINAL__=true;
  var BASE=2147481000;
  var step=0;
  var modalSelector=[
    '.modal',
    '.edit-modal',
    '.member-edit-modal',
    '.temp-edit-modal',
    '.pkl-notice-layer',
    '.pkl-result-admin-modal',
    '.pkl-delete-confirm-modal',
    '#resultAdminModal',
    '#resultDeleteConfirmModal'
  ].join(',');
  function isOpen(el){
    if(!el || !el.classList) return false;
    var cs;
    try{cs=getComputedStyle(el);}catch(e){cs=null;}
    return el.classList.contains('open') ||
      el.getAttribute('aria-hidden')==='false' ||
      (cs && cs.position==='fixed' && cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0');
  }
  function setLayer(el,z){
    if(!el || !el.style) return;
    el.classList.add('pkl-layer-managed-modal');
    el.style.setProperty('z-index', String(z), 'important');
    el.style.setProperty('pointer-events', 'auto', 'important');
    var kids=el.querySelectorAll(':scope > *, [role="dialog"], .modal-box, .modal-card, .pkl-result-admin-panel, .pkl-delete-confirm-box, .pkl-notice-card, .temp-edit-box');
    kids.forEach(function(k){
      k.style.setProperty('z-index', String(z+1), 'important');
      k.style.setProperty('pointer-events','auto','important');
      if(getComputedStyle(k).position==='static') k.style.setProperty('position','relative','important');
    });
  }
  function bring(el){
    if(!el) return;
    step+=10;
    setLayer(el,BASE+step);
  }
  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(modalSelector),function(el){
      if(isOpen(el) && !el.dataset.pklLayerNoAuto){
        if(!el.dataset.pklLayerOrder){
          el.dataset.pklLayerOrder=String(++step);
        }
        setLayer(el,BASE+Number(el.dataset.pklLayerOrder));
      }else if(el && el.dataset){
        delete el.dataset.pklLayerOrder;
      }
    });
  }
  window.PKLBringModalToFront=function(el){
    if(typeof el==='string') el=document.querySelector(el);
    if(el){ delete el.dataset.pklLayerOrder; bring(el); }
  };
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest && e.target.closest(modalSelector);
    if(el) window.PKLBringModalToFront(el);
    setTimeout(scan,0);
    setTimeout(scan,80);
  },true);
  var mo=new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target;
      if(el && el.matches && el.matches(modalSelector) && isOpen(el)) window.PKLBringModalToFront(el);
    });
    setTimeout(scan,0);
  });
  function boot(){
    try{mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden']});}catch(e){}
    scan();
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>


<script id="pklReferralFieldLogic">
(function(){
  let referralOk=false;
  function findRegisterBody(){
    const nick=document.querySelector('#nicknameInput,#registerNickname,#pklNicknameInput,input[name="nickname"]');
    const pubg=document.querySelector('#pubgInput,#registerPubgId,#pklPubgInput,input[name="pubgId"]');
    if(!nick||!pubg)return null;
    return pubg.closest('form,.modal,.login-card,.join-card,body');
  }
  function install(){
    const body=findRegisterBody();
    if(!body||document.getElementById('pklReferralInput'))return;
    const pubg=document.querySelector('#pubgInput,#registerPubgId,#pklPubgInput,input[name="pubgId"]');
    const row=document.createElement('div');
    row.className='pkl-referral-row';
    row.innerHTML='<input id="pklReferralInput" class="pkl-referral-input" type="text" placeholder="추천인 닉네임 또는 배그 ID"><button id="pklReferralCheckBtn" class="pkl-referral-check" type="button">추천인확인</button><div id="pklReferralMsg" class="pkl-referral-msg"></div>';
    pubg.closest('.profile-field,.field,.form-row,div')?.after(row);
    document.getElementById('pklReferralCheckBtn').onclick=checkReferral;
  }
  async function checkReferral(){
    const input=document.getElementById('pklReferralInput');
    const msg=document.getElementById('pklReferralMsg');
    const q=String(input&&input.value||'').trim();
    referralOk=false;
    if(!q){if(msg)msg.textContent='추천인을 입력해주세요.';return;}
    try{
      const res=await fetch('/api/pkl-users?limit=500&q='+encodeURIComponent(q)+'&_='+Date.now(),{headers:{'Cache-Control':'no-store'}});
      const data=await res.json().catch(()=>null);
      const rows=(Array.isArray(data)?data:(data&&Array.isArray(data.users)?data.users:(data&&Array.isArray(data.rows)?data.rows:[])))||[];
      const found=rows.find(u=>String(u.nickname||u.name||'').trim()===q || String(u.pubg_id||u.pubgId||u.gameId||'').trim()===q);
      if(found){referralOk=true;if(msg){msg.style.color='#86efac';msg.textContent='확인되었습니다. 가입 시 추천인에게 2,000 프라임이 지급됩니다.';}}
      else{if(msg){msg.style.color='#fca5a5';msg.textContent='존재하지 않는 추천인입니다.';}}
    }catch(e){if(msg){msg.style.color='#fca5a5';msg.textContent='추천인 확인 실패';}}
  }
  const oldFetch=window.fetch;
  window.fetch=function(input,init){
    try{
      const url=String(typeof input==='string'?input:(input&&input.url)||'');
      if(url.includes('/api/pkl-register-user')&&init&&init.body){
        const body=JSON.parse(init.body);
        const ref=document.getElementById('pklReferralInput');
        if(ref&&ref.value&&referralOk) body.recommender=ref.value.trim();
        init={...init,body:JSON.stringify(body)};
      }
    }catch(e){}
    return oldFetch.call(this,input,init);
  };
  document.addEventListener('DOMContentLoaded',install);
  setTimeout(install,500);
})();
</script>
</body>
</html>
