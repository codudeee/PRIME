<style>

  --bg:#05040c;--panel:#0a0a14;--panel2:#11111f;--line:rgba(174,123,255,.34);--line-strong:rgba(201,168,255,.55);
  --purple:#9b5cff;--purple2:#c9a8ff;--cyan:#8be7ff;--gold:#ffd45a;--red:#ff4d64;--text:#f8f7ff;--muted:#9691ad;--dim:#6e6a82;

*{box-sizing:border-box}
html,body{margin:0;min-height:100%;background:var(--bg);color:var(--text);font-family:Pretendard,'Noto Sans KR','Malgun Gothic',system-ui,sans-serif;}
body{

}

.site{position:relative;z-index:1;min-height:100vh;}#pklCommonHeader{min-height:70px;}
.search-page{width:min(1500px,calc(100vw - 42px));margin:0 auto;padding:26px 0 48px;}
.hero{text-align:center;margin:2px 0 22px;}

.hero-title{margin:7px 0 7px;font-size:34px;font-weight:1000;letter-spacing:-.5px;text-shadow:0 0 22px rgba(155,92,255,.58);}
.hero-title span{color:var(--purple2)}
.hero-desc{margin:0;color:var(--muted);font-size:14px;font-weight:800;}
.search-shell{width:min(720px,100%);margin:0 auto 20px;padding:9px;border:1px solid rgba(201,168,255,.36);border-radius:17px;background:linear-gradient(180deg,rgba(255,255,255,.05),rgba(255,255,255,.012)),rgba(8,8,18,.80);box-shadow:0 0 30px rgba(155,92,255,.14),inset 0 0 0 1px rgba(255,255,255,.04);display:grid;grid-template-columns:1fr 112px;gap:8px;backdrop-filter:blur(10px);}

.search-input:focus{box-shadow:inset 0 0 0 1px rgba(201,168,255,.62),0 0 16px rgba(155,92,255,.18)}
.search-autocomplete-wrap{

}





.search-autocomplete-item{

.search-autocomplete-item:hover,

}

.search-autocomplete-badge{
display:flex;
align-items:center;
justify-content:center;

font-weight:900;

}

.search-autocomplete-name{

.search-btn{height:48px;border-radius:12px;border:1px solid rgba(201,168,255,.36);background:linear-gradient(180deg,rgba(155,92,255,.72),rgba(72,35,148,.72));color:#fff;font-size:15px;font-weight:1000;box-shadow:0 10px 24px rgba(0,0,0,.32),0 0 18px rgba(155,92,255,.14);}
.search-btn:hover{filter:brightness(1.12);}
.record-layout{display:grid;grid-template-columns:minmax(0,1fr) 290px;gap:16px;align-items:start;}

.panel{border:1px solid var(--line);border-radius:18px;background:linear-gradient(180deg,rgba(255,255,255,.045),rgba(255,255,255,.012) 38%,rgba(255,255,255,.004)),radial-gradient(circle at 50% -20%,rgba(155,92,255,.15),transparent 50%),rgba(7,7,15,.88);box-shadow:0 24px 60px rgba(0,0,0,.42),0 0 0 1px rgba(255,255,255,.035) inset,0 0 34px rgba(155,92,255,.10);overflow:hidden;backdrop-filter:blur(10px);}
.tabs{height:48px;padding:8px 10px;border-bottom:1px solid rgba(255,255,255,.075);display:flex;gap:8px;background:linear-gradient(90deg,rgba(155,92,255,.14),rgba(255,255,255,.012),transparent);}

.tab-btn.active{color:#fff;border-color:rgba(201,168,255,.55);background:linear-gradient(180deg,rgba(155,92,255,.32),rgba(80,42,158,.34));box-shadow:0 0 16px rgba(155,92,255,.16);}

.avatar{position:relative;width:94px;height:94px;border-radius:50%;border:2px solid rgba(201,168,255,.55);background:linear-gradient(180deg,rgba(255,255,255,.20),rgba(255,255,255,.04));box-shadow:0 0 26px rgba(155,92,255,.34),inset 0 0 18px rgba(255,255,255,.05);}

.summary{min-width:0;display:grid;gap:16px;}

.stat-label{font-size:11px;color:#8f8aa3;font-weight:1000;letter-spacing:.8px}.stat-value{margin-top:6px;font-size:25px;font-weight:1000;color:#fff;text-shadow:0 0 14px rgba(155,92,255,.28)}
.summary-row{border:1px solid rgba(255,255,255,.08);border-radius:14px;background:rgba(255,255,255,.028);padding:14px 16px;display:grid;grid-template-columns:1fr 1fr;gap:12px;}
.mini-label{font-size:11px;font-weight:1000;color:#8f8aa3;letter-spacing:.8px;margin-bottom:5px}.mini-value{font-size:14px;font-weight:1000;color:#fff;line-height:1.4;word-break:keep-all;}
.table-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid rgba(255,255,255,.075);background:linear-gradient(90deg,rgba(155,92,255,.14),rgba(255,255,255,.012),transparent)}
.table-title{font-size:18px;font-weight:1000;font-style:italic;letter-spacing:.5px}.table-title span{color:var(--purple2)}.table-note{font-size:12px;font-weight:900;color:var(--muted)}
.table-wrap{overflow:auto;padding:12px;}.history-table{width:100%;min-width:780px;border-collapse:separate;border-spacing:0;table-layout:fixed;}
.history-table th,.history-table td{height:42px;text-align:center;border-right:1px solid rgba(255,255,255,.08);border-bottom:1px solid rgba(255,255,255,.075);background:rgba(5,6,14,.50);font-size:13px;font-weight:900;}
.history-table th:first-child,.history-table td:first-child{border-left:1px solid rgba(255,255,255,.08)}.history-table thead th{height:43px;background:linear-gradient(180deg,rgba(32,24,60,.98),rgba(13,14,27,.98));color:#e9dcff;font-size:12px;font-weight:1000;}
.empty{min-height:285px;display:grid;place-items:center;text-align:center;padding:34px;color:var(--muted);}.empty h3{margin:0 0 8px;color:#fff;font-size:25px;font-weight:1000}.empty p{margin:0;font-size:14px;font-weight:800;line-height:1.6}.empty-mark{width:70px;height:70px;margin:0 auto 14px;border-radius:20px;border:1px solid rgba(201,168,255,.32);background:rgba(155,92,255,.08);display:grid;place-items:center;font-size:31px;box-shadow:0 0 22px rgba(155,92,255,.14)}
.side-stack{display:grid;gap:12px;}.side-panel{padding:16px;}.side-kicker{font-size:11px;font-weight:1000;letter-spacing:2.4px;color:#b9a4e4;text-transform:uppercase;margin-bottom:8px}.side-title{font-size:20px;font-weight:1000;margin-bottom:12px}.rank-list{display:grid;gap:7px}.rank-item{min-height:38px;border:1px solid rgba(255,255,255,.08);border-radius:11px;background:rgba(255,255,255,.032);display:grid;grid-template-columns:26px 1fr auto;align-items:center;gap:8px;padding:0 10px;font-size:13px;font-weight:1000}.rank-no{color:var(--purple2)}.rank-score{color:#fff}.info-box{border:1px solid rgba(255,255,255,.08);border-radius:13px;background:rgba(255,255,255,.032);padding:14px;margin-top:10px}.info-box b{display:block;font-size:25px;margin-top:4px}.team-chip-wrap{display:flex;flex-wrap:wrap;gap:8px}.team-chip{min-height:34px;border-radius:10px;border:1px solid rgba(201,168,255,.24);background:rgba(155,92,255,.08);padding:8px 12px;font-size:13px;font-weight:1000;color:#e9dcff}.notice{margin-top:10px;font-size:12px;font-weight:800;line-height:1.55;color:#8f8aa3;}
.hidden{display:none!important;}
@media (max-width:1150px){.record-layout{grid-template-columns:1fr}.profile-body{grid-template-columns:1fr}.player-card{height:180px}.side-stack{grid-template-columns:1fr 1fr}.stat-grid{grid-template-columns:repeat(2,1fr)}}

<body>

<!-- PKL_COMMON_HEADER_ENABLED -->

                <div><div class="mini-label">최근 참여</div><div class="mini-value" id="recentMatch">-</div></div>

<script>
const STORAGE_KEY='PKL_EFFICIENT_MATCH_SHEET_LIVE_SYNC_V1';
const RESULT_MATCHES_KEY='PKL_RESULT_MATCHES_V1';
const USER_MATCH_STATS_KEY='PKL_USER_MATCH_STATS_V1';
const RECENT_KEY='PKL_PLAYER_SEARCH_RECENT_V1';
const DEMO_NAMES=[];
const DEFAULT_MATCHES=[];
function makeDemo(){
  return {
    mode:'squad',
    selectedTeamId:'',
    teams:[],
    rounds:[],
    startTime:'',
    endTime:''
  };
}
async function pklGetSharedValue(key,fallback){
  try{
    if(window.PKLSupabaseDataSync && typeof window.PKLSupabaseDataSync.getShared==='function'){
      const value=await window.PKLSupabaseDataSync.getShared(key);
      if(value!==null && value!==undefined) return value;
    }
  }catch(e){}
  try{
    const res=await fetch('/api/pkl-data-store?type=shared&key='+encodeURIComponent(key),{cache:'no-store'});
    if(res.ok){
      const data=await res.json();
      if(data && data.item && Object.prototype.hasOwnProperty.call(data.item,'value') && data.item.value!==null) return data.item.value;
    }
  }catch(e){}
  return fallback;
}
async function loadState(){
  const saved=await pklGetSharedValue(STORAGE_KEY,null);
  if(saved&&Array.isArray(saved.teams)&&saved.teams.some(t=>Array.isArray(t.members)&&t.members.some(m=>String(m&&m.name||'').trim()))){
    return Object.assign(makeDemo(),saved,{rounds:Array.isArray(saved.rounds)&&saved.rounds.length?saved.rounds:makeDemo().rounds});
  }
  return makeDemo();
}
async function loadMatches(){
  const saved=await pklGetSharedValue(RESULT_MATCHES_KEY,[]);
  return Array.isArray(saved)?saved:[];
}
function esc(v){return String(v??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function norm(v){return String(v||'').trim().replace(/\s+/g,'').toLowerCase();}
function teamData(round,teamId){return (round.teams&&round.teams[teamId])||{kills:[0,0,0,0],deaths:[0,0,0,0],chicken:0,stop:0};}
function visibleTeams(){return (state.teams||[]).slice(0,10).map((t,i)=>({id:t.id||'team'+(i+1),name:t.name||t.teamName||('TEAM '+(i+1)),members:(Array.isArray(t.members)?t.members:[]).slice(0,4)}));}
function chickenScore(round,data){return Number(data.chicken||0)?(String(round.map||'')==='사'?5:8):0;}
function pklIsNormalMatch(match){return String(match&&match.kind||'').toLowerCase()==='normal'||/일반/.test(String(match&&match.title||''))||/일반/.test(String(match&&match.type||''));}
function pklSnapshotVisibleTeams(snapshot){const st=snapshot&&typeof snapshot==='object'?snapshot:{};const mode=st.mode||'squad';const teams=Array.isArray(st.teams)?st.teams:[];if(mode==='duo'){const out=[];teams.forEach((t,i)=>{const id=t.id||('team'+(i+1));const mem=Array.isArray(t.members)?t.members:[];out.push({id:id+'a',realId:id,name:(mem[0]&&mem[0].name?mem[0].name:(i+1)+'팀')+' A',offset:0,len:2,members:mem});out.push({id:id+'b',realId:id,name:(mem[2]&&mem[2].name?mem[2].name:(i+1)+'팀')+' B',offset:2,len:2,members:mem});});return out;}return teams.map((t,i)=>({id:t.id||('team'+(i+1)),realId:t.id||('team'+(i+1)),name:t.name||t.teamName||(((i+1)+'팀')),offset:0,len:4,members:Array.isArray(t.members)?t.members:[]}));}
function pklRowsFromResultMatches(mode){const rows=[];const wantNormal=mode==='normal';(Array.isArray(matches)?matches:[]).forEach(match=>{if(!match)return;const isNormal=pklIsNormalMatch(match);if(wantNormal!==isNormal)return;const snap=match.snapshot&&typeof match.snapshot==='object'?match.snapshot:null;if(!snap)return;const rounds=Array.isArray(snap.rounds)?snap.rounds:[];pklSnapshotVisibleTeams(snap).forEach(team=>{for(let idx=team.offset;idx<team.offset+team.len;idx++){const member=team.members[idx]||{};const name=String(member.name||member.nickname||member.nick||member.displayName||'').trim();if(!name||name==='-')continue;let kills=0,deaths=0,bestRoundKill=0,roundCount=0;rounds.forEach(round=>{const d=(round&&round.teams&&round.teams[team.realId])||{};const rk=Number((Array.isArray(d.kills)?d.kills:[])[idx]||0);const rd=Number((Array.isArray(d.deaths)?d.deaths:[])[idx]||0);kills+=rk;deaths+=rd;bestRoundKill=Math.max(bestRoundKill,rk);roundCount+=1;});rows.push({matchId:match.id,matchTitle:match.title||'PKL 회차',savedAt:match.savedAt||match.date||'',name,teamName:team.name,kills,deaths,bestRoundKill,roundCount,mode:wantNormal?'normal':'paid'});}});});return rows;}
let state=makeDemo();let matches=[];let players=[];let current=null;
function buildPlayers(){
const map=new Map();
try{
  const stats=pklRowsFromResultMatches('paid');
  if(Array.isArray(stats) && stats.length){

const searchInput=document.getElementById('searchInput');

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function getInitials(text=''){
  return [...text].map(char=>{
    const code=char.charCodeAt(0)-44032;
    if(code>=0 && code<=11171){
      return CHO[Math.floor(code/588)];
    }
    return char.toLowerCase();
  }).join('');
}

function matchPlayer(name,query){
  const q=query.trim().toLowerCase();
  if(!q)return false;

  return (
    norm(name).includes(norm(q)) ||
    getInitials(name).includes(q) ||
    name.toLowerCase().includes(q)
  );
}

function hideAutocomplete(){
  searchAutocomplete.style.display='none';
  searchAutocomplete.innerHTML='';
}

function showAutocomplete(query){
  const q=query.trim();

  if(!q){
    hideAutocomplete();
    return;
  }

  const matches=players
    .filter(p=>matchPlayer(p.name,q))
    .slice(0,8);

  if(!matches.length){
    hideAutocomplete();
    return;
  }

  searchAutocomplete.innerHTML=matches.map(p=>{
    const user=(window.PKLUserProfile&&window.PKLUserProfile.hydrate)?window.PKLUserProfile.hydrate(p):p;

    </div>`;
  }).join('');

  
searchAutocomplete.style.display='flex';

}

<script id="pkl-autocomplete-script">
(function(){

const input = document.getElementById('searchInput');
const box = document.getElementById('searchAutocomplete');

if(!input || !box) return;

if(box.parentElement !== document.body){
  document.body.appendChild(box);
}

const CHO=['ㄱ','ㄲ','ㄴ','ㄷ','ㄸ','ㄹ','ㅁ','ㅂ','ㅃ','ㅅ','ㅆ','ㅇ','ㅈ','ㅉ','ㅊ','ㅋ','ㅌ','ㅍ','ㅎ'];

function getInitials(text=''){
  return String(text).split('').map(char=>{
    const code = char.charCodeAt(0)-44032;

    if(code>=0 && code<=11171){
      return CHO[Math.floor(code/588)];
    }

    return char.toLowerCase();

  }).join('');
}

function getUsers(){
  /* 전적검색 유저 자동완성은 Supabase에서 방금 읽어온 window.PKLSupabaseUsers만 사용한다.
     단일 식별자는 discord_id이며 nickname 기준 dedupe/merge는 카운트 불일치와 유저 누락 원인이 된다. */
  const source = Array.isArray(window.PKLSupabaseUsers) ? window.PKLSupabaseUsers : [];
  const seenId=new Set();
  return source.filter(u=>{
    const did=String(u.discordId||u.discord_id||'').trim().toLowerCase().replace(/^discord-/, '');
    if(!did) return false;
    if(seenId.has(did)) return false;
    seenId.add(did);
    return true;
  });
}

function hide(){
  box.style.display='none';
  box.innerHTML='';
}

function updatePosition(){

  const rect = input.getBoundingClientRect();

  box.style.left = rect.left + 'px';
  box.style.top = (rect.bottom + 8) + 'px';
  box.style.width = rect.width + 'px';

}

function render(query){

  const q = String(query || '').trim();

  if(!q){
    hide();
    return;
  }

  const users = getUsers();

  const matched = users.filter(user=>{

    const nick = String(
      user.nickname ||
      user.name ||
      ''
    );

    const pubg = String(
      user.pubgName ||
      user.playerName ||
      user.ingameName ||
      user.pubgId ||
      user.gameId ||
      ''
    );

    const cho = getInitials(nick);

    return (
      nick.includes(q) ||
      nick.toLowerCase().includes(q.toLowerCase()) ||
      pubg.toLowerCase().includes(q.toLowerCase()) ||
      cho.includes(q)
    );

  }).slice(0,8);

  if(!matched.length){
    hide();
    return;
  }

  box.innerHTML = matched.map(user=>{

    const rawTier =
      user.tierBadge ||
      user.tierBadgeHtml ||
      user.tierImage ||
      user.tierIcon ||
      user.tierName ||
      user.tierText ||
      user.currentTier ||
      user.tier ||
      user.rank ||
      user.grade ||
      '';

    const pubg =
      user.pubgName ||
      user.playerName ||
      user.ingameName ||
      user.pubgId ||
      user.gameId ||
      '-';

    const nick =
      user.nickname ||
      user.name ||
      '-';

    let badgeHtml = '';

    if(typeof rawTier === 'string' && rawTier.includes('pkl-tier-badge')){
      badgeHtml = rawTier;
    }else if(
      window.PKLTierBadge &&
      typeof window.PKLTierBadge.renderForUser === 'function'
    ){
      badgeHtml = window.PKLTierBadge.renderForUser(user);
    }else if(
      window.PKLTierBadge &&
      typeof window.PKLTierBadge.render === 'function' &&
      rawTier &&
      rawTier !== '없음'
    ){
      badgeHtml = window.PKLTierBadge.render(rawTier);
    }else if(rawTier && rawTier !== '없음'){
      badgeHtml = `<span>${rawTier}</span>`;
    }else{
      badgeHtml = '';
    }

    return `
      <div class="search-autocomplete-item" data-name="${nick}">
        <div class="search-autocomplete-badge">${badgeHtml}</div>

        <div class="search-autocomplete-meta">
          <div class="search-autocomplete-name">${nick}</div>
          <div class="search-autocomplete-pubg">${pubg}</div>
        </div>
      </div>
    `;

  }).join('');

  updatePosition();

  box.style.display='flex';

}

input.addEventListener('input',e=>{
  render(e.target.value);
});

window.addEventListener('resize',()=>{
  if(box.style.display==='flex'){
    updatePosition();
  }
});

window.addEventListener('scroll',()=>{
  if(box.style.display==='flex'){
    updatePosition();
  }
}, true);

box.addEventListener('mousedown',e=>{

  const item=e.target.closest('.search-autocomplete-item');

  if(!item) return;

  input.value=item.dataset.name;

  hide();

  if(typeof searchPlayer==='function'){
    searchPlayer(item.dataset.name);
  }

});

document.addEventListener('click',e=>{

  if(
    !e.target.closest('.search-autocomplete-wrap') &&
    !e.target.closest('#searchAutocomplete')
  ){
    hide();
  }

});

})();
</script>

<!-- PKL global stacked modal layer manager -->
<style id="pkl-global-stacked-modal-layer-style">
  .pkl-layer-managed-modal{
    position:fixed !important;
    pointer-events:auto !important;
  }
  .pkl-layer-managed-modal > *,
  .pkl-layer-managed-modal [role="dialog"],
  .pkl-layer-managed-modal .modal-box,
  .pkl-layer-managed-modal .modal-card,
  .pkl-layer-managed-modal .pkl-result-admin-panel,

    position:relative !important;

<script id="pkl-global-stacked-modal-layer-script">
(function(){
  if(window.__PKL_STACKED_MODAL_LAYER_FINAL__) return;
  window.__PKL_STACKED_MODAL_LAYER_FINAL__=true;
  var BASE=2147481000;
  var step=0;
  var modalSelector=[
    '.modal',
    '.edit-modal',
    '.member-edit-modal',
    '.temp-edit-modal',
    '.pkl-notice-layer',
    '.pkl-result-admin-modal',
    '.pkl-delete-confirm-modal',
    '#resultAdminModal',
    '#resultDeleteConfirmModal'
  ].join(',');
  function isOpen(el){
    if(!el || !el.classList) return false;
    var cs;
    try{cs=getComputedStyle(el);}catch(e){cs=null;}
    return el.classList.contains('open') ||
      el.getAttribute('aria-hidden')==='false' ||
      (cs && cs.position==='fixed' && cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0');
  }
  function setLayer(el,z){
    if(!el || !el.style) return;
    el.classList.add('pkl-layer-managed-modal');
    el.style.setProperty('z-index', String(z), 'important');
    el.style.setProperty('pointer-events', 'auto', 'important');
    var kids=el.querySelectorAll(':scope > *, [role="dialog"], .modal-box, .modal-card, .pkl-result-admin-panel, .pkl-delete-confirm-box, .pkl-notice-card, .temp-edit-box');
    kids.forEach(function(k){
      k.style.setProperty('z-index', String(z+1), 'important');
      k.style.setProperty('pointer-events','auto','important');
      if(getComputedStyle(k).position==='static') k.style.setProperty('position','relative','important');
    });
  }
  function bring(el){
    if(!el) return;
    step+=10;
    setLayer(el,BASE+step);
  }
  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(modalSelector),function(el){
      if(isOpen(el) && !el.dataset.pklLayerNoAuto){
        if(!el.dataset.pklLayerOrder){
          el.dataset.pklLayerOrder=String(++step);
        }
        setLayer(el,BASE+Number(el.dataset.pklLayerOrder));
      }else if(el && el.dataset){
        delete el.dataset.pklLayerOrder;
      }
    });
  }
  window.PKLBringModalToFront=function(el){
    if(typeof el==='string') el=document.querySelector(el);
    if(el){ delete el.dataset.pklLayerOrder; bring(el); }
  };
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest && e.target.closest(modalSelector);
    if(el) window.PKLBringModalToFront(el);
    setTimeout(scan,0);
    setTimeout(scan,80);
  },true);
  var mo=new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target;
      if(el && el.matches && el.matches(modalSelector) && isOpen(el)) window.PKLBringModalToFront(el);
    });
    setTimeout(scan,0);
  });
  function boot(){
    try{mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden']});}catch(e){}
    scan();
    /* 반복 스캔 제거: MutationObserver/click 시점에만 정렬 */
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>


<script id="pkl-search-supabase-users-loader">
(function(){
  if(window.__PKL_SEARCH_SUPABASE_USERS_LOADER__) return;
  window.__PKL_SEARCH_SUPABASE_USERS_LOADER__=true;
  function norm(v){return String(v||'').trim().replace(/\s+/g,'').toLowerCase();}
  function mapUser(u){u=u||{};var nick=u.nickname||u.name||u.nick||u.discord_username||'';return Object.assign({},u,{nickname:nick,name:nick,pubgId:u.pubgId||u.pubg_id||u.gameId||''});}
  async function load(){
    try{
      var all=[]; var offset=0; var limit=100;
      while(offset<500){
        var res=await fetch('/api/pkl-users?limit='+limit+'&offset='+offset,{cache:'no-store'});
        var data=await res.json();
        var users=Array.isArray(data.users)?data.users:[];
        all=all.concat(users);
        if(!users.length || users.length<limit) break;
        offset+=limit;
      }
      window.PKLSupabaseUsers=all.map(mapUser);
      if(!window.PKLSupabaseUsers.length) return;
      if(typeof buildPlayers==='function'){
        var built=buildPlayers();
        var map=new Map();
        (Array.isArray(built)?built:[]).forEach(function(p){if(p&&p.name)map.set(norm(p.name),p);});
        window.PKLSupabaseUsers.forEach(function(u){var nick=u.nickname||u.name;if(!nick)return;var key=norm(nick);if(!map.has(key))map.set(key,{name:nick,teams:[],rows:[],totalKills:0,totalDeaths:0,bestKill:0,rounds:0,score:0,avg:0});});
        players=Array.from(map.values()).sort(function(a,b){return (b.totalKills||0)-(a.totalKills||0)||String(a.name).localeCompare(String(b.name),'ko');});
        if(typeof renderTop==='function') renderTop();
        try{var el=document.getElementById('searchInput'); if(el && el.value && typeof el.dispatchEvent==='function') el.dispatchEvent(new Event('input',{bubbles:true}));}catch(_e){}
      }
    }catch(e){console.error('PKL search Supabase users load failed',e);}
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',load); else load();
})();
</script>
