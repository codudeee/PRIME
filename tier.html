/* =========================================================
   PKL MY HOVER DROPDOWN - working final
   ========================================================= */
.account-wrap{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
}

.account-trigger{
  position:relative !important;
  cursor:pointer !important;
}

.account-menu{
  display:block !important;
  position:absolute !important;
  top:52px !important;
  right:0 !important;
  width:184px !important;
  padding:9px !important;
  border-radius:12px !important;
  border:1px solid rgba(213,184,255,.34) !important;
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.20),transparent 42%),
    linear-gradient(180deg,rgba(12,10,24,.96),rgba(5,5,12,.98)) !important;
  box-shadow:
    0 24px 60px rgba(0,0,0,.58),
    0 0 32px rgba(168,85,247,.24),
    inset 0 0 28px rgba(255,255,255,.025) !important;
  backdrop-filter:blur(16px) !important;
  -webkit-backdrop-filter:blur(16px) !important;
  opacity:0 !important;
  visibility:hidden !important;
  transform:translateY(10px) scale(.96) !important;
  transform-origin:top right !important;
  pointer-events:none !important;
  transition:opacity .22s ease, transform .22s ease, visibility .22s ease !important;
  z-index:9999 !important;
}

.account-wrap.is-logged-in:hover .account-menu,
.account-menu.open{
  opacity:1 !important;
  visibility:visible !important;
  transform:translateY(0) scale(1) !important;
  pointer-events:auto !important;
}

.account-menu::before{
  content:"";
  position:absolute;
  left:20px;
  right:20px;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#a855f7,#f2eaff,#a855f7,transparent);
  box-shadow:0 0 16px rgba(168,85,247,.9);
}

.account-menu button{
  width:100% !important;
  height:42px !important;
  border:0 !important;
  border-radius:8px !important;
  background:transparent !important;
  color:rgba(255,255,255,.78) !important;
  font-size:14px !important;
  font-weight:1000 !important;
  text-align:left !important;
  padding:0 14px !important;
  cursor:pointer !important;
  display:flex !important;
  align-items:center !important;
  transition:.18s ease !important;
}

.account-menu button + button{
  margin-top:6px !important;
}

.account-menu button:hover{
  color:#fff !important;
  background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(168,85,247,.06),transparent) !important;
  padding-left:20px !important;
  text-shadow:0 0 14px rgba(168,85,247,.85) !important;
}

/* FIX: center align + hover gap */
.account-menu{
  left:50% !important;
  right:auto !important;
  transform:translateX(-50%) translateY(10px) scale(.96) !important;
}

.account-wrap.is-logged-in:hover .account-menu{
  transform:translateX(-50%) translateY(0) scale(1) !important;
}

/* hover bridge (prevents flicker) */
.account-wrap::after{
  content:"";
  position:absolute;
  left:-20px;
  right:-20px;
  top:100%;
  height:20px;
}

.account-wrap{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}

.account-menu{
  display:block !important;
  position:absolute !important;
  top:calc(100% + 12px) !important;
  left:50% !important;
  right:auto !important;
  transform:translateX(-50%) translateY(8px) scale(.96) !important;
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease !important;
  z-index:9999 !important;
}

.account-wrap:hover .account-menu,
.account-menu:hover,
.account-menu.open{
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
  transform:translateX(-50%) translateY(0) scale(1) !important;
}

/* keep a small invisible bridge so moving mouse down doesn't close it */
.account-wrap::after{
  content:"";
  position:absolute;
  left:50%;
  top:100%;
  transform:translateX(-50%);
  width:190px;
  height:16px;

    if(!window.__PKL_TIER_PREFETCH_PROMISE){window.__PKL_TIER_PREFETCH_PROMISE=(async function(){var all=[],offset=0,limit=100;while(offset<1200){var res=await fetch('/api/pkl-users?limit='+limit+'&offset='+offset+'&tierOnly=1',{cache:'no-store',headers:{Accept:'application/json'}});var data=await res.json().catch(function(){return{};});if(!res.ok||!data.ok)throw new Error(data.message||'tier users fetch failed');var rows=Array.isArray(data.users)?data.users:[];all=all.concat(rows);var normalized=normalizeUsers(all);if(offset===0&&normalized.length){paint(normalized,{first:true});writeCache(normalized);}if(rows.length<limit)break;offset+=limit;}var finalUsers=normalizeUsers(all);writeCache(finalUsers);paint(finalUsers,{final:true});return finalUsers;})().catch(function(err){console.error('PKL tier early load failed',err);return window.__PKL_TIER_PREFETCH_DATA||[];});}
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',boot,{once:true});else boot();
})();
</script>

.pkl-tier-loading-member{opacity:.38!important;filter:saturate(.55)!important;pointer-events:none!important;}
</style>

<script>
/* PKL TIER MY + MAILBOX SYNC WITH INDEX */
(function(){
  const MAIL_KEYS = ["pklMailbox","pklMails","pklUserMails","pklMailList"];

  function getLoginUser(){
    try{
      return JSON.parse(localStorage.getItem("pklLoginUser") || sessionStorage.getItem("pklLoginUser") || "null");
    }catch(e){
      return null;
    }
  }

  function normalizeMail(mail, index){
    return {
      id: mail.id || mail.mailId || ("mail-" + index + "-" + (mail.date || mail.createdAt || "")),
      title: mail.title || mail.subject || "PKL 우편",
      body: mail.body || mail.content || mail.message || "내용이 없습니다.",
      date: mail.date || mail.createdAt || mail.time || "",
      to: mail.to || mail.receiver || mail.nickname || mail.target || "all",
      read: !!(mail.read || mail.isRead || mail.readAt),
      deleted: !!mail.deleted,
      raw: mail
    };
  }

  function readAllMails(){
    for(const key of MAIL_KEYS){
      try{
        const data = JSON.parse(localStorage.getItem(key) || "null");
        if(Array.isArray(data)) return data.map(normalizeMail);
      }catch(e){}
    }
    return [];
  }

  function saveAllMails(mails){
    const clean = mails.map(m => {
      const raw = m.raw && typeof m.raw === "object" ? {...m.raw} : {};
      return {
        ...raw,
        id: m.id,
        title: m.title,
        body: m.body,
        date: m.date,
        to: m.to,
        read: !!m.read,
        isRead: !!m.read,
        deleted: !!m.deleted,
        readAt: m.read ? (raw.readAt || new Date().toISOString()) : raw.readAt
      };
    });

    // index에서 어떤 key를 보든 같이 반영되게 주요 key에 동시 저장
    localStorage.setItem("pklMailbox", JSON.stringify(clean));
    localStorage.setItem("pklMails", JSON.stringify(clean));
  }

  function belongsToUser(mail, user){
    if(!user) return false;
    const nick = user.nickname || user.nick || user.name || "";
    const pubg = user.pubgId || "";
    const to = mail.to || "all";
    return !to || to === "all" || to === nick || to === pubg;
  }

  function userMails(){
    const user = getLoginUser();
    return readAllMails().filter(m => !m.deleted && belongsToUser(m, user));
  }

  function unreadCount(){
    return userMails().filter(m => !m.read).length;
  }

  function setButtonText(button, text){
    if(!button) return;
    let done = false;
    for(const node of button.childNodes){
      if(node.nodeType === Node.TEXT_NODE){
        node.nodeValue = text;
        done = true;
        break;
      }
    }
    if(!done) button.insertBefore(document.createTextNode(text), button.firstChild);
  }

  function syncTop(){
    const user = getLoginUser();
    const loginBtn = document.getElementById("loginBtn");
    const managerBtn = document.getElementById("managerBtn");
    const accountWrap = document.querySelector(".account-wrap");
    const accountMenu = document.getElementById("accountMenu");
    const mailBadge = document.getElementById("mailBadge");
    const mailboxMenuCount = document.getElementById("mailboxMenuCount");

    if(user){
      setButtonText(loginBtn, "MY");
      if(accountWrap) accountWrap.classList.add("is-logged-in");
      if(accountMenu){
        accountMenu.classList.remove("logged-out");
        accountMenu.style.display = "";
      }
      if(managerBtn){
        managerBtn.style.display = (user.role === "manager" || user.role === "operator") ? "flex" : "none";
      }

      const count = unreadCount();
      if(mailBadge){
        if(count > 0){
          mailBadge.textContent = String(count);
          mailBadge.classList.add("show");
        }else{
          mailBadge.textContent = "";
          mailBadge.classList.remove("show");
        }
      }
      if(mailboxMenuCount){
        if(count > 0){
          mailboxMenuCount.textContent = String(count);
          mailboxMenuCount.style.display = "inline-flex";
        }else{
          mailboxMenuCount.textContent = "";
          mailboxMenuCount.style.display = "none";
        }
      }
      const modalCount = document.getElementById("mailboxUnreadCount");
      if(modalCount){
        modalCount.textContent = String(count);
        modalCount.style.display = count > 0 ? "inline-flex" : "none";
      }
    }else{
      setButtonText(loginBtn, "로그인");
      if(accountWrap) accountWrap.classList.remove("is-logged-in");
      if(managerBtn) managerBtn.style.display = "none";
      if(accountMenu){
        accountMenu.classList.add("logged-out");
        accountMenu.classList.remove("open");
        accountMenu.style.display = "none";
      }
      if(mailBadge){
        mailBadge.textContent = "";
        mailBadge.classList.remove("show");
      }
      if(mailboxMenuCount){
        mailboxMenuCount.textContent = "";
        mailboxMenuCount.style.display = "none";
      }
    }
  }

  window.goUserPage = function(){
    location.href = getLoginUser() ? "myinfo.html" : "login.html";
  };

  window.openMyInfo = function(){
    location.href = getLoginUser() ? "myinfo.html" : "login.html";
  };

  window.logout = function(){
    localStorage.removeItem("pklLoginUser");
    sessionStorage.removeItem("pklLoginUser");
    location.href = "login.html";
  };

  window.openMailboxModal = function(){
    if(!getLoginUser()){
      location.href = "login.html";
      return;
    }
    const modal = document.getElementById("mailboxModal");
    if(!modal) return;
    modal.classList.add("open");
    renderMailboxList();
    syncTop();
  };

  window.closeMailboxModal = function(){
    const modal = document.getElementById("mailboxModal");
    if(modal) modal.classList.remove("open");
  };

  window.renderMailboxList = function(){
    const listEl = document.getElementById("mailboxList");
    const detailEl = document.getElementById("mailDetail");
    if(!listEl) return;
    if(detailEl){
      detailEl.classList.remove("open");
      detailEl.innerHTML = "";
    }

    const mails = userMails().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    if(!mails.length){
      listEl.innerHTML = '<div class="mail-empty">우편함이 비어있습니다.</div>';
      return;
    }

    listEl.innerHTML = mails.map(m => `
      <button class="mail-row ${m.read ? 'read' : ''}" onclick="openMailDetail('${String(m.id).replace(/'/g,"&#39;")}')">
        <div>
          <div class="mail-row-title">${escapeHtml(m.title)}</div>
          <div class="mail-row-date">${escapeHtml(m.date || "-")}</div>
        </div>
        <span class="mail-row-badge">${m.read ? "읽음" : "NEW"}</span>
      </button>
    `).join("");
  };

  window.openMailDetail = function(id){
    const all = readAllMails();
    const idx = all.findIndex(m => String(m.id) === String(id));
    if(idx < 0) return;

    all[idx].read = true;
    saveAllMails(all);

    const mail = all[idx];
    const listEl = document.getElementById("mailboxList");
    const detailEl = document.getElementById("mailDetail");
    if(listEl) listEl.innerHTML = "";
    if(detailEl){
      detailEl.classList.add("open");
      detailEl.innerHTML = `
        <div class="mail-detail-top">
          <h3>${escapeHtml(mail.title)}</h3>
          <div class="mail-detail-date">${escapeHtml(mail.date || "-")}</div>
        </div>
        <p>${escapeHtml(mail.body || "내용이 없습니다.").replace(/\\n/g,"<br>").replace(/\n/g,"<br>")}</p>
        <div class="mail-detail-actions">
          <button class="mail-back" onclick="renderMailboxList();syncPklTierTop();">목록</button>
          <button class="mail-delete" onclick="confirmDeleteMail('${String(mail.id).replace(/'/g,"&#39;")}')">삭제</button>
        </div>
      `;
    }
    syncTop();
  };


  window.askDeleteAllMails = function(){
    const confirm = document.getElementById("mailDeleteAllConfirm");
    if(confirm) confirm.classList.add("open");
  };

  window.closeDeleteAllConfirm = function(){
    const confirm = document.getElementById("mailDeleteAllConfirm");
    if(confirm) confirm.classList.remove("open");
  };

  window.deleteAllMails = function(){
    const all = readAllMails();
    const user = getLoginUser();
    all.forEach(m => {
      if(belongsToUser(m, user)) m.deleted = true;
    });
    saveAllMails(all);
    closeDeleteAllConfirm();
    renderMailboxList();
    syncTop();
  };

  window.markAllMailsRead = function(){
    const all = readAllMails();
    const user = getLoginUser();
    all.forEach(m => {
      if(!m.deleted && belongsToUser(m, user)) m.read = true;
    });
    saveAllMails(all);
    renderMailboxList();
    syncTop();
  };

  window.confirmDeleteMail = function(id){
    const confirm = document.getElementById("mailConfirm");
    const yes = document.getElementById("mailConfirmYes");
    if(!confirm || !yes){
      deleteMail(id);
      return;
    }
    confirm.classList.add("open");
    yes.onclick = function(){
      deleteMail(id);
      closeMailConfirm();
    };
  };

  window.closeMailConfirm = function(){
    const confirm = document.getElementById("mailConfirm");
    if(confirm) confirm.classList.remove("open");
  };

  window.deleteMail = function(id){
    const all = readAllMails();
    all.forEach(m => {
      if(String(m.id) === String(id)) m.deleted = true;
    });
    saveAllMails(all);
    renderMailboxList();
    syncTop();
  };

  window.syncPklTierTop = syncTop;

  function escapeHtml(v){
    return String(v ?? "").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[m]));
  }

  /* PKL TIER ADMIN STATE SYNC */
  const PKL_TIER_DATA_KEY = "pklAdminState_v3";

  const PKL_TIER_ROLE_TO_LANE = {
    tier0_high:"0상", tier0_mid:"0중", tier0_low:"0하",
    tier1_high:"1상", tier1_mid:"1중", tier1_low:"1하",
    tier2_high:"2상", tier2_mid:"2중", tier2_low:"2하",
    tier3_high:"3상", tier3_mid:"3중", tier3_low:"3하",
    tier4_high:"4상", tier4_mid:"4중", tier4_low:"4하",
    beast:"짐승"
  };

  const PKL_TIER_LANE_TO_ROLE = {
    "0상":"tier0_high", "0중":"tier0_mid", "0하":"tier0_low",
    "1상":"tier1_high", "1중":"tier1_mid", "1하":"tier1_low",
    "2상":"tier2_high", "2중":"tier2_mid", "2하":"tier2_low",
    "3상":"tier3_high", "3중":"tier3_mid", "3하":"tier3_low",
    "4상":"tier4_high", "4중":"tier4_mid", "4하":"tier4_low",
    "짐승":"beast"
  };

  const PKL_TIER_ROLE_LABELS = {
    none:"없음",
    tier0_high:"0티어 상", tier0_mid:"0티어 중", tier0_low:"0티어 하",
    tier1_high:"1티어 상", tier1_mid:"1티어 중", tier1_low:"1티어 하",
    tier2_high:"2티어 상", tier2_mid:"2티어 중", tier2_low:"2티어 하",
    tier3_high:"3티어 상", tier3_mid:"3티어 중", tier3_low:"3티어 하",
    tier4_high:"4티어 상", tier4_mid:"4티어 중", tier4_low:"4티어 하",
    beast:"짐승"
  };

  function pklTierReadAdminState(){
    /* Supabase 단일 원본: 티어표는 PKLUsersSource/PKLUserProfile 메모리 캐시를 seed로 쓰지 않는다.
       캐시 seed가 남아 있으면 예전 localStorage/복원 배열과 Supabase 결과가 합쳐져 같은 닉네임이 중복 표시된다. */
    return { users:[], pending:[], bans:[], warningRecords:[] };
  }

  function pklTierSaveAdminState(state){
    /* 티어 운영 데이터는 Supabase users가 단일 원본이다.
       이 함수는 구버전 호환용으로만 남기고 localStorage 저장/복원을 하지 않는다. */
    if(window.PKLUserProfile && typeof window.PKLUserProfile.setUsers === "function"){
      window.PKLUserProfile.setUsers(Array.isArray(state && state.users)?state.users:[], false);
    }
  }

  function pklTierUserKey(user, index){
    return String(
      user?.uid ||
      user?.id ||
      user?.userId ||
      user?.account ||
      user?.loginId ||
      user?.email ||
      user?.pubgId ||
      user?.nickname ||
      index
    ).trim();
  }

  function pklTierUserName(user){
    return String(user?.nickname || user?.nick || user?.name || user?.pubgId || user?.pubgID || "").trim();
  }

  function pklTierNormalizeRole(role){
    role = String(role || "").trim();
    if(PKL_TIER_ROLE_TO_LANE[role]) return role;

    const legacy = {
      tier0:"tier0_mid", tier1:"tier1_mid", tier2:"tier2_mid", tier3:"tier3_mid", tier4:"tier4_mid"
    };
    if(legacy[role]) return legacy[role];

    return "";
  }

  function pklTierRoleFromText(text){
    text = String(text || "").trim().replace(/\s+/g,"");
    const map = {
      "0티어상":"tier0_high", "0상":"tier0_high",
      "0티어중":"tier0_mid", "0중":"tier0_mid",
      "0티어하":"tier0_low", "0하":"tier0_low",
      "1티어상":"tier1_high", "1상":"tier1_high",
      "1티어중":"tier1_mid", "1중":"tier1_mid",
      "1티어하":"tier1_low", "1하":"tier1_low",
      "2티어상":"tier2_high", "2상":"tier2_high",
      "2티어중":"tier2_mid", "2중":"tier2_mid",
      "2티어하":"tier2_low", "2하":"tier2_low",
      "3티어상":"tier3_high", "3상":"tier3_high",
      "3티어중":"tier3_mid", "3중":"tier3_mid",
      "3티어하":"tier3_low", "3하":"tier3_low",
      "4티어상":"tier4_high", "4상":"tier4_high",
      "4티어중":"tier4_mid", "4중":"tier4_mid",
      "4티어하":"tier4_low", "4하":"tier4_low",
      "짐승":"beast"
    };
    return map[text] || "";
  }

  function pklTierHasValue(v){ return v !== null && v !== undefined && String(v).trim() !== ""; }
  function pklTierGradeRole(user){
    const primary = [user?.memberTier,user?.gradeRole,user?.tierRole,user?.tier];
    for(const field of primary){
      if(!pklTierHasValue(field)) continue;
      const direct = pklTierNormalizeRole(field) || pklTierRoleFromText(field);
      return direct || "";
    }
    const legacy = [user?.baseRole,user?.originalRole,user?.memberTierName,user?.tierName,user?.roleName];
    for(const field of legacy){
      if(!pklTierHasValue(field)) continue;
      const direct = pklTierNormalizeRole(field) || pklTierRoleFromText(field);
      if(direct) return direct;
    }
    return "";
  }

  function pklTierCurrentUserForEdit(){
    const keys = ["discordUser", "pklLoginUser", "pklCurrentUser", "pklUser", "pklLoggedInUser", "pkl_current_user", "PKL_로그인_USER", "currentUser"];
    for(const key of keys){
      try{
        const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
        if(!raw) continue;
        const user = JSON.parse(raw);
        if(user && typeof user === "object") return user;
      }catch(e){}
    }
    return null;
  }

  function pklTierIsAdminUser(user){
    if(!user || typeof user !== "object") return false;

    if(user.isAdmin === true || user.admin === true || user.isManager === true || user.isOperator === true) return true;

    const values = [
      user.role,
      user.memberRole,
      user.permission,
      user.grade,
      user.auth,
      user.type,
      user.position,
      user.level,
      user.accountType
    ].map(v => String(v || "").trim().toLowerCase());

    if(values.some(role =>
      role === "manager" ||
      role === "operator" ||
      role === "admin" ||
      role === "administrator" ||
      role === "owner" ||
      role === "master" ||
      role === "총관리자" ||
      role === "관리자" ||
      role === "운영자" ||
      role === "운영진" ||
      role.includes("관리자") ||
      role.includes("운영")
    )) return true;

    return false;
  }

  function pklTierCanEdit(){
    return pklTierIsAdminUser(pklTierCurrentUserForEdit());
  }
  window.pklTierCanEdit = pklTierCanEdit;

  function pklTierVisibleUsers(){
    const state = pklTierReadAdminState();
    const seen = new Set();

    return state.users
      .map((user, index) => {
        const key = pklTierUserKey(user, index);
        const name = pklTierUserName(user);
        const role = pklTierGradeRole(user);
        const lane = PKL_TIER_ROLE_TO_LANE[role] || "";
        return { key, index, name, role, lane, user };
      })
      .filter(item => {
        if(!item.key || !item.name || !item.lane) return false;
        if(seen.has(item.key)) return false;
        seen.add(item.key);
        return true;
      });
  }

  function pklTierSyncUsersToAccountStorage(state){
    /* Supabase 단일 원본: 티어표는 pklUsers/localStorage에 유저 목록을 저장하지 않는다. */
    return;
  }

  function pklTierSetUserRole(userKey, targetLane){
    const targetRole = PKL_TIER_LANE_TO_ROLE[targetLane];
    if(!targetRole) return false;

    const state = pklTierReadAdminState();
    let changed = false;

    state.users = state.users.map((user, index) => {
      if(pklTierUserKey(user, index) !== userKey) return user;

      changed = true;
      const nextTierLabel = PKL_TIER_ROLE_LABELS[targetRole] || "없음";
      return {
        ...user,
        memberTier:targetRole,
        memberTierName:nextTierLabel,
        tier:nextTierLabel,
        updatedAt:new Date().toISOString()
      };
    });

    if(changed) pklTierSaveAdminState(state);
    return changed;
  }

  function renderPklTierMembers(){
    const lists = document.querySelectorAll(".pkl-lane-list[data-tier]");
    if(!lists.length) return;

    lists.forEach(list => {
      list.querySelectorAll(".pkl-tier-member").forEach(node => node.remove());
      list.classList.remove("pkl-drop-ready");
    });

    pklTierVisibleUsers().forEach(item => {
      const list = document.querySelector('.pkl-lane-list[data-tier="' + item.lane + '"]');
      if(!list) return;

      const badge = document.createElement("div");
      badge.className = "pkl-tier-member";
      badge.textContent = item.name;
      badge.dataset.userKey = item.key;
      badge.dataset.lane = item.lane;
      badge.setAttribute("draggable", pklTierCanEdit() ? "true" : "false");
      list.appendChild(badge);
    });

    pklTierBindDrag();
  }

  function pklTierBindDrag(){
    const lists = Array.from(document.querySelectorAll(".pkl-lane-list[data-tier]"));
    document.querySelectorAll(".pkl-tier-member").forEach(badge => {
      badge.setAttribute("draggable", pklTierCanEdit() ? "true" : "false");
      badge.dataset.canDrag = pklTierCanEdit() ? "1" : "0";

      badge.ondragstart = function(e){
        if(!pklTierCanEdit()){
          e.preventDefault();
          return false;
        }

        badge.classList.add("pkl-dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify({
          userKey:badge.dataset.userKey,
          from:badge.dataset.lane
        }));

        try{
          const ghost = badge.cloneNode(true);
          ghost.style.position = "fixed";
          ghost.style.top = "-1000px";
          ghost.style.left = "-1000px";
          ghost.style.zIndex = "999999";
          ghost.style.pointerEvents = "none";
          ghost.style.opacity = "0.96";
          ghost.style.transform = "scale(1.08)";
          ghost.style.boxShadow = "0 14px 34px rgba(0,0,0,.52), 0 0 24px rgba(168,85,247,.46)";
          document.body.appendChild(ghost);
          e.dataTransfer.setDragImage(ghost, Math.max(10, Math.floor(ghost.offsetWidth / 2)), Math.max(10, Math.floor(ghost.offsetHeight / 2)));
          setTimeout(function(){ ghost.remove(); }, 0);
        }catch(err){}
      };

      badge.ondragend = function(){
        badge.classList.remove("pkl-dragging");
        lists.forEach(list => list.classList.remove("pkl-drop-ready"));
      };
    });

    lists.forEach(list => {
      list.ondragenter = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        list.classList.add("pkl-drop-ready");
      };

      list.ondragover = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
        list.classList.add("pkl-drop-ready");
      };

      list.ondragleave = function(e){
        if(!list.contains(e.relatedTarget)) list.classList.remove("pkl-drop-ready");
      };

      list.ondrop = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        e.stopPropagation();
        list.classList.remove("pkl-drop-ready");

        let payload = {};
        try{
          payload = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
        }catch(err){}

        const targetLane = list.dataset.tier;
        if(!payload.userKey || !targetLane || payload.from === targetLane) return;

        if(pklTierSetUserRole(payload.userKey, targetLane)){

<script id="pklTierScoreSyncScript">
(function(){
  const SCORE_KEY = "pklTierScoreConfig";
  const ROLE_TO_LANE = {
    tier0_high:"0상", tier0_mid:"0중", tier0_low:"0하",
    tier1_high:"1상", tier1_mid:"1중", tier1_low:"1하",
    tier2_high:"2상", tier2_mid:"2중", tier2_low:"2하",
    tier3_high:"3상", tier3_mid:"3중", tier3_low:"3하",
    tier4_high:"4상", tier4_mid:"4중", tier4_low:"4하",
    beast:"짐승"
  };
  function readConfig(){
    try{
      const data = JSON.parse(localStorage.getItem(SCORE_KEY) || "null");
      if(data && typeof data === "object") return data;
    }catch(e){}
    return {};
  }
  function normalizeNumber(value, fallback){
    const n = Number(String(value ?? "").replace(/[^0-9-]/g,""));
    return Number.isFinite(n) ? n : fallback;
  }
  function collectConfig(){
    const config = readConfig();
    document.querySelectorAll(".pkl-tier-lane").forEach(laneEl => {
      const list = laneEl.querySelector(".pkl-lane-list[data-tier]");
      const inputs = laneEl.querySelectorAll(".pkl-lane-score input");
      if(!list || inputs.length < 2) return;
      const lane = String(list.dataset.tier || "").trim();
      if(!lane) return;
      const target = normalizeNumber(inputs[0].value, normalizeNumber(inputs[0].getAttribute("value"), 0));
      const death = normalizeNumber(inputs[1].value, normalizeNumber(inputs[1].getAttribute("value"), 0));
      config[lane] = { target, death };
      const role = Object.keys(ROLE_TO_LANE).find(key => ROLE_TO_LANE[key] === lane);
      if(role) config[role] = { target, death, lane };
    });
    localStorage.setItem(SCORE_KEY, JSON.stringify(config));
    localStorage.setItem("pklTierScoreLastSync", JSON.stringify({ at:new Date().toISOString() }));
  }
  function applyConfig(){
    const config = readConfig();
    document.querySelectorAll(".pkl-tier-lane").forEach(laneEl => {
      const list = laneEl.querySelector(".pkl-lane-list[data-tier]");
      const inputs = laneEl.querySelectorAll(".pkl-lane-score input");
      if(!list || inputs.length < 2) return;
      const lane = String(list.dataset.tier || "").trim();
      const saved = config[lane];
      if(!saved) return;
      if(saved.target !== undefined && saved.target !== null && String(saved.target) !== "") inputs[0].value = saved.target;
      if(saved.death !== undefined && saved.death !== null && String(saved.death) !== "") inputs[1].value = saved.death;
    });
  }
  function bind(){
    applyConfig();
    collectConfig();
    document.querySelectorAll(".pkl-lane-score input").forEach(input => {
      if(input.dataset.pklTierScoreSync === "1") return;
      input.dataset.pklTierScoreSync = "1";
      input.addEventListener("input", collectConfig);
      input.addEventListener("change", collectConfig);
    });
  }
  if(document.readyState === "loading"){
    document.addEventListener("DOMContentLoaded", bind);
  }else{
    bind();
  }
  window.pklTierCollectScoreConfig = collectConfig;
})();
</script>


<script id="pklTierManualDragFix">
(function(){
  let drag = null;

  function canEdit(){
    return typeof pklTierCanEdit === "function" && pklTierCanEdit();
  }

  function clearDropReady(){
    document.querySelectorAll(".pkl-lane-list.pkl-drop-ready").forEach(el => {
      el.classList.remove("pkl-drop-ready");
    });
  }

  function getLaneUnderPoint(x, y){
    const prev = drag && drag.ghost ? drag.ghost.style.pointerEvents : "";
    if(drag && drag.ghost) drag.ghost.style.pointerEvents = "none";
    const el = document.elementFromPoint(x, y);
    if(drag && drag.ghost) drag.ghost.style.pointerEvents = prev;
    return el ? el.closest(".pkl-lane-list[data-tier]") : null;
  }

  function startManualDrag(e){
    const badge = e.target.closest(".pkl-tier-member");
    if(!badge) return;
    if(!canEdit()){
      badge.setAttribute("draggable", "false");
      badge.dataset.canDrag = "0";
      return;
    }
    if(e.button !== 0) return;

    e.preventDefault();
    e.stopPropagation();

    const rect = badge.getBoundingClientRect();
    const ghost = badge.cloneNode(true);

    ghost.classList.add("pkl-manual-drag-ghost");
    ghost.style.position = "fixed";
    ghost.style.left = rect.left + "px";
    ghost.style.top = rect.top + "px";
    ghost.style.width = rect.width + "px";
    ghost.style.height = rect.height + "px";
    ghost.style.zIndex = "999999";
    ghost.style.pointerEvents = "none";
    ghost.style.margin = "0";
    ghost.style.transform = "scale(1.06)";
    ghost.style.opacity = "0.96";

    document.body.appendChild(ghost);

    badge.classList.add("pkl-manual-drag-source");

    drag = {
      badge,
      ghost,
      offsetX:e.clientX - rect.left,
      offsetY:e.clientY - rect.top,
      userKey:badge.dataset.userKey,
      from:badge.dataset.lane
    };

    document.body.classList.add("pkl-manual-dragging");
    moveManualDrag(e);
  }

  function moveManualDrag(e){
    if(!drag) return;

    const x = e.clientX;
    const y = e.clientY;

    drag.ghost.style.left = (x - drag.offsetX) + "px";
    drag.ghost.style.top = (y - drag.offsetY) + "px";

    clearDropReady();
    const lane = getLaneUnderPoint(x, y);
    if(lane) lane.classList.add("pkl-drop-ready");
  }

  function endManualDrag(e){
    if(!drag) return;

    const targetLaneEl = getLaneUnderPoint(e.clientX, e.clientY);
    const targetLane = targetLaneEl ? targetLaneEl.dataset.tier : "";

    const userKey = drag.userKey;
    const from = drag.from;

    drag.badge.classList.remove("pkl-manual-drag-source");
    drag.ghost.remove();
    document.body.classList.remove("pkl-manual-dragging");
    clearDropReady();

    drag = null;

    if(!targetLane || !userKey || targetLane === from) return;

    try{
      if(typeof pklTierSetUserRole === "function" && pklTierSetUserRole(userKey, targetLane)){
        if(typeof renderPklTierMembers === "function") renderPklTierMembers();
      }
    }catch(err){
      console.error("PKL tier manual drag failed", err);
    }
  }

  document.addEventListener("mousedown", startManualDrag, true);
  document.addEventListener("mousemove", function(e){
    if(drag){
      e.preventDefault();
      moveManualDrag(e);
    }
  }, true);
  document.addEventListener("mouseup", function(e){
    if(drag){
      e.preventDefault();
      endManualDrag(e);
    }
  }, true);

  document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && drag){
      drag.badge.classList.remove("pkl-manual-drag-source");
      drag.ghost.remove();
      document.body.classList.remove("pkl-manual-dragging");
      clearDropReady();
      drag = null;
    }
  });
})();
</script>

<script id="pkl-global-stacked-modal-layer-script">
(function(){
  if(window.__PKL_STACKED_MODAL_LAYER_FINAL__) return;
  window.__PKL_STACKED_MODAL_LAYER_FINAL__=true;
  var BASE=2147481000;
  var step=0;
  var modalSelector=[
    '.modal',
    '.edit-modal',
    '.member-edit-modal',
    '.temp-edit-modal',
    '.pkl-notice-layer',
    '.pkl-result-admin-modal',
    '.pkl-delete-confirm-modal',
    '#resultAdminModal',
    '#resultDeleteConfirmModal'
  ].join(',');
  function isOpen(el){
    if(!el || !el.classList) return false;
    var cs;
    try{cs=getComputedStyle(el);}catch(e){cs=null;}
    return el.classList.contains('open') ||
      el.getAttribute('aria-hidden')==='false' ||
      (cs && cs.position==='fixed' && cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0');
  }
  function setLayer(el,z){
    if(!el || !el.style) return;
    el.classList.add('pkl-layer-managed-modal');
    el.style.setProperty('z-index', String(z), 'important');
    el.style.setProperty('pointer-events', 'auto', 'important');
    var kids=el.querySelectorAll(':scope > *, [role="dialog"], .modal-box, .modal-card, .pkl-result-admin-panel, .pkl-delete-confirm-box, .pkl-notice-card, .temp-edit-box');
    kids.forEach(function(k){
      k.style.setProperty('z-index', String(z+1), 'important');
      k.style.setProperty('pointer-events','auto','important');
      if(getComputedStyle(k).position==='static') k.style.setProperty('position','relative','important');
    });
  }
  function bring(el){
    if(!el) return;
    step+=10;
    setLayer(el,BASE+step);
  }
  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(modalSelector),function(el){
      if(isOpen(el) && !el.dataset.pklLayerNoAuto){
        if(!el.dataset.pklLayerOrder){
          el.dataset.pklLayerOrder=String(++step);
        }
        setLayer(el,BASE+Number(el.dataset.pklLayerOrder));
      }else if(el && el.dataset){
        delete el.dataset.pklLayerOrder;
      }
    });
  }
  window.PKLBringModalToFront=function(el){
    if(typeof el==='string') el=document.querySelector(el);
    if(el){ delete el.dataset.pklLayerOrder; bring(el); }
  };
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest && e.target.closest(modalSelector);
    if(el) window.PKLBringModalToFront(el);
    setTimeout(scan,0);
    setTimeout(scan,80);
  },true);
  var mo=new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target;
      if(el && el.matches && el.matches(modalSelector) && isOpen(el)) window.PKLBringModalToFront(el);
    });
    setTimeout(scan,0);
  });
  function boot(){
    try{mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden']});}catch(e){}
    scan();
    /* 반복 스캔 제거: MutationObserver/click 시점에만 정렬 */
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>



<script id="pkl-tier-optimized-single-source-20260514">
(function(){
  'use strict';

  var ROLE_TO_LANE = {
    tier0_high:'0상', tier0_mid:'0중', tier0_low:'0하',
    tier1_high:'1상', tier1_mid:'1중', tier1_low:'1하',
    tier2_high:'2상', tier2_mid:'2중', tier2_low:'2하',
    tier3_high:'3상', tier3_mid:'3중', tier3_low:'3하',
    tier4_high:'4상', tier4_mid:'4중', tier4_low:'4하',
    beast:'짐승'
  };
  var LANE_TO_ROLE = {
    '0상':'tier0_high', '0중':'tier0_mid', '0하':'tier0_low',
    '1상':'tier1_high', '1중':'tier1_mid', '1하':'tier1_low',
    '2상':'tier2_high', '2중':'tier2_mid', '2하':'tier2_low',
    '3상':'tier3_high', '3중':'tier3_mid', '3하':'tier3_low',
    '4상':'tier4_high', '4중':'tier4_mid', '4하':'tier4_low',
    '짐승':'beast'
  };
  var LABEL = {
    none:'없음',
    tier0_high:'0티어 상', tier0_mid:'0티어 중', tier0_low:'0티어 하',
    tier1_high:'1티어 상', tier1_mid:'1티어 중', tier1_low:'1티어 하',
    tier2_high:'2티어 상', tier2_mid:'2티어 중', tier2_low:'2티어 하',
    tier3_high:'3티어 상', tier3_mid:'3티어 중', tier3_low:'3티어 하',
    tier4_high:'4티어 상', tier4_mid:'4티어 중', tier4_low:'4티어 하',
    beast:'짐승'
  };

  var cache = [];
  var loadingPromise = null;
  var lastPaintSignature = '';
  var pendingRender = 0;
  var PREVIEW_CACHE_KEY = 'PKL_TIER_RENDER_PREVIEW_V2';
  var PREVIEW_CACHE_TTL = 1000 * 60 * 5;

  function readPreviewCache(){
    try{
      var raw = sessionStorage.getItem(PREVIEW_CACHE_KEY);
      if(!raw) return [];
      var box = JSON.parse(raw);
      if(!box || !Array.isArray(box.users)) return [];
      if(Date.now() - Number(box.time || 0) > PREVIEW_CACHE_TTL) return [];
      return normalizeUsers(box.users);
    }catch(e){ return []; }
  }
  function writePreviewCache(users){
    try{
      if(!Array.isArray(users) || !users.length) return;
      sessionStorage.setItem(PREVIEW_CACHE_KEY, JSON.stringify({time:Date.now(), users:users.slice(0, 500)}));
    }catch(e){}
  }

  function clean(v){ return String(v == null ? '' : v).trim(); }
  function escapeCss(v){
    if(window.CSS && typeof CSS.escape === 'function') return CSS.escape(String(v));
    return String(v).replace(/["\\]/g, '\\$&');
  }
  function didOf(u){
    u = u || {};
    var did = clean(u.discordId || u.discord_id || u.discordID);
    if(did) return did.replace(/^discord-/i,'');
    var keys = ['uid','id','userId','user_id','key'];
    for(var i=0;i<keys.length;i++){
      var raw = clean(u[keys[i]]);
      if(/^discord-/i.test(raw)) return raw.replace(/^discord-/i,'');
    }
    return '';
  }
  function nickOf(u){
    return clean(u && (u.nickname || u.name || u.nick || u.pubgId || u.pubgID || u.discordUsername || u.discord_username || u.username));
  }
  function normalizeTier(v){
    var raw = clean(v);
    if(!raw || raw === '없음' || raw.toLowerCase() === 'none') return 'none';
    try{
      if(window.PKLTierBadge && typeof window.PKLTierBadge.normalize === 'function'){
        var n = window.PKLTierBadge.normalize(raw);
        if(n) raw = n;
      }
    }catch(e){}
    var compact = clean(raw).replace(/\s+/g,'');
    var byText = {
      '0티어상':'tier0_high','0상':'tier0_high','0티어중':'tier0_mid','0중':'tier0_mid','0티어하':'tier0_low','0하':'tier0_low',
      '1티어상':'tier1_high','1상':'tier1_high','1티어중':'tier1_mid','1중':'tier1_mid','1티어하':'tier1_low','1하':'tier1_low',
      '2티어상':'tier2_high','2상':'tier2_high','2티어중':'tier2_mid','2중':'tier2_mid','2티어하':'tier2_low','2하':'tier2_low',
      '3티어상':'tier3_high','3상':'tier3_high','3티어중':'tier3_mid','3중':'tier3_mid','3티어하':'tier3_low','3하':'tier3_low',
      '4티어상':'tier4_high','4상':'tier4_high','4티어중':'tier4_mid','4중':'tier4_mid','4티어하':'tier4_low','4하':'tier4_low',
      '짐승':'beast','beast':'beast'
    };
    if(ROLE_TO_LANE[raw]) return raw;
    if(byText[compact]) return byText[compact];
    if(raw === 'tier0') return 'tier0_mid';
    if(raw === 'tier1') return 'tier1_mid';
    if(raw === 'tier2') return 'tier2_mid';
    if(raw === 'tier3') return 'tier3_mid';
    if(raw === 'tier4') return 'tier4_mid';
    return raw;
  }
  function tierOf(u){
    u = u || {};
    var fields = [u.memberTier, u.gradeRole, u.tierRole, u.tier, u.memberTierName, u.tierName, u.roleName, u.baseRole, u.originalRole];
    for(var i=0;i<fields.length;i++){
      if(clean(fields[i])){
        var t = normalizeTier(fields[i]);
        if(t && t !== 'none') return t;
      }
    }
    return 'none';
  }
  function keyOf(u){ return didOf(u); }
  function labelOf(t){ t = normalizeTier(t); return LABEL[t] || t || '없음'; }
  function canEdit(){ return typeof window.pklTierCanEdit === 'function' ? !!window.pklTierCanEdit() : false; }

  function normalizeUsers(list){
    var seenDid = new Set();
    var seenNick = new Set();
    var out = [];
    (Array.isArray(list) ? list : []).forEach(function(row){
      var did = didOf(row);
      var nick = nickOf(row);
      var tier = tierOf(row);
      if(!did || !nick || !ROLE_TO_LANE[tier]) return;
      var didKey = did.toLowerCase();
      var nickKey = nick.replace(/\s+/g,'').toLowerCase();
      if(seenDid.has(didKey)) return;
      if(nickKey && seenNick.has(nickKey)) return;
      seenDid.add(didKey);
      if(nickKey) seenNick.add(nickKey);
      out.push(Object.assign({}, row, {
        discordId:did,
        nickname:nick,
        memberTier:tier,
        gradeRole:tier,
        tierRole:tier,
        tier:tier === 'none' ? '없음' : labelOf(tier),
        memberTierName:labelOf(tier)
      }));
    });
    out.sort(function(a,b){ return nickOf(a).localeCompare(nickOf(b), 'ko-KR', {numeric:true, sensitivity:'base'}); });
    return out;
  }

  function signatureOf(users){
    return users.map(function(u){ return keyOf(u) + ':' + tierOf(u) + ':' + nickOf(u); }).join('|');
  }

  async function fetchTierUsers(force){
    if(loadingPromise) return loadingPromise;
    if(!force && cache.length) return Promise.resolve(cache.slice());
    if(!force && window.__PKL_TIER_PREFETCH_PROMISE){
      loadingPromise = window.__PKL_TIER_PREFETCH_PROMISE.then(function(users){
        cache = normalizeUsers(users || window.__PKL_TIER_PREFETCH_DATA || []);
        writePreviewCache(cache);
        return cache.slice();
      }).finally(function(){ loadingPromise = null; });
      return loadingPromise;
    }

    loadingPromise = (async function(){
      try{
        var all = [];
        var offset = 0;
        var limit = 100;
        while(offset < 1200){
          var res = await fetch('/api/pkl-users?limit=' + limit + '&offset=' + offset + '&tierOnly=1', {
            cache:'no-store',
            headers:{Accept:'application/json'}
          });
          var data = await res.json().catch(function(){ return {}; });
          if(!res.ok || !data.ok) throw new Error(data.message || 'tier users fetch failed');
          var rows = Array.isArray(data.users) ? data.users : [];
          all = all.concat(rows);

          // 2차 최적화: 전체 페이지를 모두 기다리지 말고 첫 페이지가 도착하는 즉시 유저칸을 먼저 그린다.
          // 이후 추가 페이지가 있으면 최종 결과만 한 번 더 보정한다.
          if(offset === 0 && rows.length){
            cache = normalizeUsers(all);
            writePreviewCache(cache);
            schedulePaint(cache.slice(), true);
          }

          if(rows.length < limit) break;
          offset += limit;
        }
        cache = normalizeUsers(all);
        writePreviewCache(cache);
        return cache.slice();
      }catch(err){
        console.error('PKL tier users load failed', err);
        return cache.slice();
      }finally{
        loadingPromise = null;
      }
    })();
    return loadingPromise;
  }

  function paintTierUsers(users, force){
    users = Array.isArray(users) ? users : [];
    var sig = signatureOf(users) + '|edit:' + (canEdit() ? '1' : '0');
    if(!force && sig === lastPaintSignature) return;
    lastPaintSignature = sig;

    var lists = Array.from(document.querySelectorAll('.pkl-lane-list[data-tier]'));
    if(!lists.length) return;

    var grouped = {};
    users.forEach(function(u){
      var lane = ROLE_TO_LANE[tierOf(u)];
      if(!lane) return;
      if(!grouped[lane]) grouped[lane] = [];
      grouped[lane].push(u);
    });

    lists.forEach(function(list){
      var lane = list.getAttribute('data-tier');
      var frag = document.createDocumentFragment();
      (grouped[lane] || []).forEach(function(u){
        var badge = document.createElement('div');
        badge.className = 'pkl-tier-member';
        badge.textContent = nickOf(u) || '회원';
        badge.dataset.userKey = keyOf(u);
        badge.dataset.lane = lane;
        badge.dataset.canDrag = canEdit() ? '1' : '0';
        badge.setAttribute('draggable', canEdit() ? 'true' : 'false');
        frag.appendChild(badge);
      });
      list.replaceChildren(frag);
      list.classList.remove('pkl-drop-ready');
    });

    if(typeof window.pklTierBindDrag === 'function'){
      try{ window.pklTierBindDrag(); }catch(e){}
    }
  }

  function schedulePaint(users, force){
    if(pendingRender) cancelAnimationFrame(pendingRender);
    pendingRender = requestAnimationFrame(function(){
      pendingRender = 0;
      paintTierUsers(users || cache, !!force);
    });
  }

  async function renderTier(force){
    var users = await fetchTierUsers(!!force);
    schedulePaint(users, !!force);
  }

  async function setUserTier(userKey, targetLane){
    var role = LANE_TO_ROLE[targetLane];
    if(!role || !canEdit()) return false;
    var users = cache.length ? cache.slice() : await fetchTierUsers(true);
    var idx = users.findIndex(function(u){ return keyOf(u) === userKey; });
    if(idx < 0) return false;

    var before = tierOf(users[idx]);
    var target = Object.assign({}, users[idx], {
      memberTier:role,
      gradeRole:role,
      tierRole:role,
      baseRole:role,
      tier:labelOf(role),
      memberTierName:labelOf(role),
      updatedAt:new Date().toISOString()
    });

    cache = users.map(function(u,i){ return i === idx ? target : u; });
    schedulePaint(cache, true);

    try{
      var res = await fetch('/api/pkl-users', {
        method:'PATCH',
        headers:{'Content-Type':'application/json','Accept':'application/json'},
        body:JSON.stringify({
          action:'updateUserWithLog',
          originalIdentity:{discordId:didOf(target), nickname:target.nickname, pubgId:target.pubgId},
          user:target,
          log:{type:'tier_change', reason:'티어표 이동: ' + labelOf(before) + ' → ' + labelOf(role), actor:'TIER'}
        })
      });
      var data = await res.json().catch(function(){ return {}; });
      if(!res.ok || !data.ok) throw new Error(data.message || 'Supabase 티어 저장 실패');
      try{ window.dispatchEvent(new CustomEvent('pkl-user-updated', {detail:{user:target}})); }catch(e){}
      return true;
    }catch(err){
      console.error(err);
      await renderTier(true);
      if(typeof window.pklAlert === 'function') window.pklAlert(err.message || '티어 변경 저장에 실패했습니다.', '저장 실패');
      return false;
    }
  }

  window.renderPklTierMembers = function(){ renderTier(false); };
  window.PKLTierReloadSupabaseUsers = function(){ renderTier(true); };
  window.pklTierSetUserRole = function(userKey, targetLane){ setUserTier(userKey, targetLane); return true; };

  document.addEventListener('DOMContentLoaded', function(){
    requestAnimationFrame(function(){
      var preview = readPreviewCache();
      if(preview.length){
        cache = preview;
        schedulePaint(preview, true);
      }
      renderTier(false);
    });
  });
})();
</script>

</body>
</html>
