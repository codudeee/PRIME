/* =========================================================
   PKL MY HOVER DROPDOWN - working final
   ========================================================= */
.account-wrap{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
}

.account-trigger{
  position:relative !important;
  cursor:pointer !important;
}

.account-menu{
  display:block !important;
  position:absolute !important;
  top:52px !important;
  right:0 !important;
  width:184px !important;
  padding:9px !important;
  border-radius:12px !important;
  border:1px solid rgba(213,184,255,.34) !important;
  background:
    radial-gradient(circle at 50% 0%,rgba(168,85,247,.20),transparent 42%),
    linear-gradient(180deg,rgba(12,10,24,.96),rgba(5,5,12,.98)) !important;
  box-shadow:
    0 24px 60px rgba(0,0,0,.58),
    0 0 32px rgba(168,85,247,.24),
    inset 0 0 28px rgba(255,255,255,.025) !important;
  backdrop-filter:blur(16px) !important;
  -webkit-backdrop-filter:blur(16px) !important;
  opacity:0 !important;
  visibility:hidden !important;
  transform:translateY(10px) scale(.96) !important;
  transform-origin:top right !important;
  pointer-events:none !important;
  transition:opacity .22s ease, transform .22s ease, visibility .22s ease !important;
  z-index:9999 !important;
}

.account-wrap.is-logged-in:hover .account-menu,
.account-menu.open{
  opacity:1 !important;
  visibility:visible !important;
  transform:translateY(0) scale(1) !important;
  pointer-events:auto !important;
}

.account-menu::before{
  content:"";
  position:absolute;
  left:20px;
  right:20px;
  top:0;
  height:1px;
  background:linear-gradient(90deg,transparent,#a855f7,#f2eaff,#a855f7,transparent);
  box-shadow:0 0 16px rgba(168,85,247,.9);
}

.account-menu button{
  width:100% !important;
  height:42px !important;
  border:0 !important;
  border-radius:8px !important;
  background:transparent !important;
  color:rgba(255,255,255,.78) !important;
  font-size:14px !important;
  font-weight:1000 !important;
  text-align:left !important;
  padding:0 14px !important;
  cursor:pointer !important;
  display:flex !important;
  align-items:center !important;
  transition:.18s ease !important;
}

.account-menu button + button{
  margin-top:6px !important;
}

.account-menu button:hover{
  color:#fff !important;
  background:linear-gradient(90deg,rgba(168,85,247,.22),rgba(168,85,247,.06),transparent) !important;
  padding-left:20px !important;
  text-shadow:0 0 14px rgba(168,85,247,.85) !important;
}

/* FIX: center align + hover gap */
.account-menu{
  left:50% !important;
  right:auto !important;
  transform:translateX(-50%) translateY(10px) scale(.96) !important;
}

.account-wrap.is-logged-in:hover .account-menu{
  transform:translateX(-50%) translateY(0) scale(1) !important;
}

/* hover bridge (prevents flicker) */
.account-wrap::after{
  content:"";
  position:absolute;
  left:-20px;
  right:-20px;
  top:100%;
  height:20px;
}

.account-wrap{
  position:relative !important;
  display:flex !important;
  align-items:center !important;
  justify-content:center !important;
}

.account-menu{
  display:block !important;
  position:absolute !important;
  top:calc(100% + 12px) !important;
  left:50% !important;
  right:auto !important;
  transform:translateX(-50%) translateY(8px) scale(.96) !important;
  opacity:0 !important;
  visibility:hidden !important;
  pointer-events:none !important;
  transition:opacity .18s ease, transform .18s ease, visibility .18s ease !important;
  z-index:9999 !important;
}

.account-wrap:hover .account-menu,
.account-menu:hover,
.account-menu.open{
  opacity:1 !important;
  visibility:visible !important;
  pointer-events:auto !important;
  transform:translateX(-50%) translateY(0) scale(1) !important;
}

.account-wrap::after{
  content:"";
  position:absolute;
  left:50%;
  top:100%;
  transform:translateX(-50%);
  width:190px;

  function tierOf(u){u=u||{};var fields=[u.memberTier,u.gradeRole,u.tierRole,u.tier,u.memberTierName,u.tierName,u.roleName,u.baseRole,u.originalRole];for(var i=0;i<fields.length;i++){if(clean(fields[i])){var t=normalizeTier(fields[i]);if(t&&t!=='none')return t;}}return'none';}

  function readCache(){try{var raw=sessionStorage.getItem(CACHE_KEY)||localStorage.getItem(CACHE_KEY);if(!raw)return[];var box=JSON.parse(raw);if(!box||!Array.isArray(box.users))return[];if(Date.now()-Number(box.time||0)>TTL)return[];return normalizeUsers(box.users);}catch(e){return[];}}

    if(!window.__PKL_TIER_PREFETCH_PROMISE){window.__PKL_TIER_PREFETCH_PROMISE=(async function(){var all=[],offset=0,limit=100;while(offset<1200){var res=await fetch('/api/pkl-users?limit='+limit+'&offset='+offset+'&tierOnly=1',{cache:'no-store',headers:{Accept:'application/json'}});var data=await res.json().catch(function(){return{};});if(!res.ok||!data.ok)throw new Error(data.message||'tier users fetch failed');var rows=Array.isArray(data.users)?data.users:[];all=all.concat(rows);var normalized=normalizeUsers(all);if(offset===0&&normalized.length){paint(normalized,{first:true});writeCache(normalized);}if(rows.length<limit)break;offset+=limit;}var finalUsers=normalizeUsers(all);writeCache(finalUsers);paint(finalUsers,{final:true});return finalUsers;})().catch(function(err){console.error('PKL tier early load failed',err);return window.__PKL_TIER_PREFETCH_DATA||[];});}

<script>
/* PKL TIER MY + MAILBOX SYNC WITH INDEX */
(function(){
  const MAIL_KEYS = ["pklMailbox","pklMails","pklUserMails","pklMailList"];

  function getLoginUser(){
    try{
      return JSON.parse(localStorage.getItem("pklLoginUser") || sessionStorage.getItem("pklLoginUser") || "null");
    }catch(e){
      return null;
    }
  }

  function normalizeMail(mail, index){
    return {
      id: mail.id || mail.mailId || ("mail-" + index + "-" + (mail.date || mail.createdAt || "")),
      title: mail.title || mail.subject || "PKL 우편",
      body: mail.body || mail.content || mail.message || "내용이 없습니다.",
      date: mail.date || mail.createdAt || mail.time || "",
      to: mail.to || mail.receiver || mail.nickname || mail.target || "all",
      read: !!(mail.read || mail.isRead || mail.readAt),
      deleted: !!mail.deleted,
      raw: mail
    };
  }

  function readAllMails(){
    for(const key of MAIL_KEYS){
      try{
        const data = JSON.parse(localStorage.getItem(key) || "null");
        if(Array.isArray(data)) return data.map(normalizeMail);
      }catch(e){}
    }
    return [];
  }

  function saveAllMails(mails){
    const clean = mails.map(m => {
      const raw = m.raw && typeof m.raw === "object" ? {...m.raw} : {};
      return {
        ...raw,
        id: m.id,
        title: m.title,
        body: m.body,
        date: m.date,
        to: m.to,
        read: !!m.read,
        isRead: !!m.read,
        deleted: !!m.deleted,
        readAt: m.read ? (raw.readAt || new Date().toISOString()) : raw.readAt
      };
    });

    // index에서 어떤 key를 보든 같이 반영되게 주요 key에 동시 저장
    localStorage.setItem("pklMailbox", JSON.stringify(clean));
    localStorage.setItem("pklMails", JSON.stringify(clean));
  }

  function belongsToUser(mail, user){
    if(!user) return false;
    const nick = user.nickname || user.nick || user.name || "";
    const pubg = user.pubgId || "";
    const to = mail.to || "all";
    return !to || to === "all" || to === nick || to === pubg;
  }

  function userMails(){
    const user = getLoginUser();
    return readAllMails().filter(m => !m.deleted && belongsToUser(m, user));
  }

  function unreadCount(){
    return userMails().filter(m => !m.read).length;
  }

  function setButtonText(button, text){
    if(!button) return;
    let done = false;
    for(const node of button.childNodes){
      if(node.nodeType === Node.TEXT_NODE){
        node.nodeValue = text;
        done = true;
        break;
      }
    }
    if(!done) button.insertBefore(document.createTextNode(text), button.firstChild);
  }

  function getTierHeaderName(user){
    return String((user && (user.nickname || user.nick || user.displayName || user.name || user.username || user.loginId || user.pubgId || user.pubg_id)) || "MY").trim();
  }

  function getTierHeaderRole(user){
    const raw = String((user && (user.memberRole || user.role || user.roleName || user.adminRole || user.permission || user.type)) || "").trim();
    const lower = raw.toLowerCase();
    if(raw === "관리자" || raw === "총관리자" || lower === "admin" || lower === "manager" || lower === "superadmin" || lower === "owner") return "admin";
    if(raw === "운영자" || raw === "운영진" || lower === "operator" || lower === "staff" || lower === "moderator") return "operator";
    return lower || "user";
  }

  function renderTierHeaderUserButton(button, user){
    if(!button) return;
    const name = escapeHtml(getTierHeaderName(user));
    const role = getTierHeaderRole(user);
    let badge = "";
    if(role === "admin" || role === "operator"){
      badge = (window.PKLRoleBadge && typeof window.PKLRoleBadge.render === "function")
        ? window.PKLRoleBadge.render(role, {extraClass:"pkl-header-role-badge"})
        : "";
    }else{
      badge = (window.PKLTierBadge && typeof window.PKLTierBadge.renderForUser === "function")
        ? window.PKLTierBadge.renderForUser(user, {extraClass:"pkl-header-tier-badge"})
        : "";
    }
    const oldBadge = button.querySelector("#mailBadge");
    button.innerHTML = '<span class="pkl-header-user-name">' + name + '</span>' + (badge ? '<span class="pkl-header-badge-stack">' + badge + '</span>' : '');
    if(oldBadge){
      const stack = button.querySelector(".pkl-header-badge-stack");
      if(stack) stack.appendChild(oldBadge);
      else button.appendChild(oldBadge);
    }else{
      button.insertAdjacentHTML("beforeend", '<span class="mail-badge" id="mailBadge" style="display:none"></span>');
    }
  }

  function syncTop(){
    /* pkl-common-header.js가 단일 헤더 렌더러다. 티어 페이지의 구버전 MY 고정 렌더는
       공통 헤더가 로드되기 전 우편함 호환용 fallback에서만 동작시킨다. */
    if(window.syncLoginState && window.syncLoginState !== syncTop){
      window.syncLoginState();
      const modalCount = document.getElementById("mailboxUnreadCount");
      if(modalCount){
        const count = unreadCount();
        modalCount.textContent = String(count);
        modalCount.style.display = count > 0 ? "inline-flex" : "none";
      }
      return;
    }

    const user = getLoginUser();
    const loginBtn = document.getElementById("loginBtn");
    const managerBtn = document.getElementById("managerBtn");
    const accountWrap = document.querySelector(".account-wrap");
    const accountMenu = document.getElementById("accountMenu");
    const mailBadge = document.getElementById("mailBadge");
    const mailboxMenuCount = document.getElementById("mailboxMenuCount");

    if(user){
      renderTierHeaderUserButton(loginBtn, user);
      if(accountWrap) accountWrap.classList.add("is-logged-in");
      if(accountMenu){
        accountMenu.classList.remove("logged-out");
        accountMenu.style.display = "";
      }
      if(managerBtn){
        const role = getTierHeaderRole(user);
        managerBtn.style.display = (role === "admin" || role === "operator") ? "flex" : "none";
      }

      const count = unreadCount();
      const activeMailBadge = document.getElementById("mailBadge") || mailBadge;
      if(activeMailBadge){
        if(count > 0){
          activeMailBadge.textContent = String(count);
          activeMailBadge.classList.add("show");
          activeMailBadge.style.display = "inline-flex";
        }else{
          activeMailBadge.textContent = "";
          activeMailBadge.classList.remove("show");
          activeMailBadge.style.display = "none";
        }
      }
      if(mailboxMenuCount){
        if(count > 0){
          mailboxMenuCount.textContent = String(count);
          mailboxMenuCount.style.display = "inline-flex";
        }else{
          mailboxMenuCount.textContent = "";
          mailboxMenuCount.style.display = "none";
        }
      }
      const modalCount = document.getElementById("mailboxUnreadCount");
      if(modalCount){
        modalCount.textContent = String(count);
        modalCount.style.display = count > 0 ? "inline-flex" : "none";
      }
    }else{
      setButtonText(loginBtn, "로그인");
      if(accountWrap) accountWrap.classList.remove("is-logged-in");
      if(managerBtn) managerBtn.style.display = "none";
      if(accountMenu){
        accountMenu.classList.add("logged-out");
        accountMenu.classList.remove("open");
        accountMenu.style.display = "none";
      }
      const activeMailBadge = document.getElementById("mailBadge") || mailBadge;
      if(activeMailBadge){
        activeMailBadge.textContent = "";
        activeMailBadge.classList.remove("show");
      }
      if(mailboxMenuCount){
        mailboxMenuCount.textContent = "";
        mailboxMenuCount.style.display = "none";
      }
    }
  }

  window.goUserPage = function(){
    location.href = getLoginUser() ? "myinfo.html" : "login.html";
  };

  window.openMyInfo = function(){
    location.href = getLoginUser() ? "myinfo.html" : "login.html";
  };

    sessionStorage.removeItem("pklLoginUser");
    location.href = "login.html";
  };

  window.openMailboxModal = function(){

      location.href = "login.html";
      return;
    }
    const modal = document.getElementById("mailboxModal");
    if(!modal) return;
    modal.classList.add("open");
    renderMailboxList();
    syncTop();
  };

  window.closeMailboxModal = function(){
    const modal = document.getElementById("mailboxModal");
    if(modal) modal.classList.remove("open");
  };

  window.renderMailboxList = function(){
    const listEl = document.getElementById("mailboxList");
    const detailEl = document.getElementById("mailDetail");
    if(!listEl) return;
    if(detailEl){
      detailEl.classList.remove("open");
      detailEl.innerHTML = "";
    }

    const mails = userMails().sort((a,b)=>String(b.date||"").localeCompare(String(a.date||"")));
    if(!mails.length){
      listEl.innerHTML = '<div class="mail-empty">우편함이 비어있습니다.</div>';
      return;
    }

    listEl.innerHTML = mails.map(m => `
      <button class="mail-row ${m.read ? 'read' : ''}" onclick="openMailDetail('${String(m.id).replace(/'/g,"&#39;")}')">
        <div>
          <div class="mail-row-title">${escapeHtml(m.title)}</div>
          <div class="mail-row-date">${escapeHtml(m.date || "-")}</div>
        </div>
        <span class="mail-row-badge">${m.read ? "읽음" : "NEW"}</span>
      </button>
    `).join("");
  };

  window.openMailDetail = function(id){
    const all = readAllMails();
    const idx = all.findIndex(m => String(m.id) === String(id));
    if(idx < 0) return;

    all[idx].read = true;
    saveAllMails(all);

    const mail = all[idx];
    const listEl = document.getElementById("mailboxList");
    const detailEl = document.getElementById("mailDetail");
    if(listEl) listEl.innerHTML = "";
    if(detailEl){
      detailEl.classList.add("open");

  };

  window.closeDeleteAllConfirm = function(){
    const confirm = document.getElementById("mailDeleteAllConfirm");
    if(confirm) confirm.classList.remove("open");
  };

  window.deleteAllMails = function(){

    const user = getLoginUser();
    all.forEach(m => {

    });
    saveAllMails(all);
    closeDeleteAllConfirm();
    renderMailboxList();
    syncTop();
  };

    const user = getLoginUser();
    all.forEach(m => {

    });
    saveAllMails(all);
    renderMailboxList();
    syncTop();
  };

  window.confirmDeleteMail = function(id){
    const confirm = document.getElementById("mailConfirm");
    const yes = document.getElementById("mailConfirmYes");

      return;
    }
    confirm.classList.add("open");
    yes.onclick = function(){

      closeMailConfirm();
    };
  };

  window.closeMailConfirm = function(){
    const confirm = document.getElementById("mailConfirm");
    if(confirm) confirm.classList.remove("open");
  };

    all.forEach(m => {
      if(String(m.id) === String(id)) m.deleted = true;

    saveAllMails(all);
    renderMailboxList();

  function pklTierReadAdminState(){

  }

  function pklTierNormalizeRole(role){
    role = String(role || "").trim();
    if(PKL_TIER_ROLE_TO_LANE[role]) return role;

    const legacy = {
      tier0:"tier0_mid", tier1:"tier1_mid", tier2:"tier2_mid", tier3:"tier3_mid", tier4:"tier4_mid"
    };
    if(legacy[role]) return legacy[role];

    return "";
  }

  function pklTierRoleFromText(text){
    text = String(text || "").trim().replace(/\s+/g,"");
    const map = {
      "0티어상":"tier0_high", "0상":"tier0_high",
      "0티어중":"tier0_mid", "0중":"tier0_mid",
      "0티어하":"tier0_low", "0하":"tier0_low",
      "1티어상":"tier1_high", "1상":"tier1_high",
      "1티어중":"tier1_mid", "1중":"tier1_mid",
      "1티어하":"tier1_low", "1하":"tier1_low",
      "2티어상":"tier2_high", "2상":"tier2_high",
      "2티어중":"tier2_mid", "2중":"tier2_mid",
      "2티어하":"tier2_low", "2하":"tier2_low",
      "3티어상":"tier3_high", "3상":"tier3_high",
      "3티어중":"tier3_mid", "3중":"tier3_mid",
      "3티어하":"tier3_low", "3하":"tier3_low",
      "4티어상":"tier4_high", "4상":"tier4_high",
      "4티어중":"tier4_mid", "4중":"tier4_mid",
      "4티어하":"tier4_low", "4하":"tier4_low",
      "5티어상":"tier5_high", "5상":"tier5_high", "5티어중":"tier5_mid", "5중":"tier5_mid", "5티어하":"tier5_low", "5하":"tier5_low",
      "짐승":"tier5_low", "짐승상":"tier5_high", "짐승중":"tier5_mid", "짐승하":"tier5_low", "짐승 상":"tier5_high", "짐승 중":"tier5_mid", "짐승 하":"tier5_low", "5티어 상":"tier5_high", "5티어 중":"tier5_mid", "5티어 하":"tier5_low"
    };
    return map[text] || "";
  }

  function pklTierHasValue(v){ return v !== null && v !== undefined && String(v).trim() !== ""; }
  function pklTierGradeRole(user){
    const primary = [user?.memberTier,user?.gradeRole,user?.tierRole,user?.tier];
    for(const field of primary){
      if(!pklTierHasValue(field)) continue;
      const direct = pklTierNormalizeRole(field) || pklTierRoleFromText(field);
      return direct || "";
    }
    const legacy = [user?.baseRole,user?.originalRole,user?.memberTierName,user?.tierName,user?.roleName];
    for(const field of legacy){
      if(!pklTierHasValue(field)) continue;
      const direct = pklTierNormalizeRole(field) || pklTierRoleFromText(field);
      if(direct) return direct;
    }
    return "";
  }

  function pklTierCurrentUserForEdit(){
    const keys = ["pklLoginUser", "pklCurrentUser", "pklLoggedInUser", "pkl_current_user", "discordUser", "pklUser", "PKL_로그인_USER", "currentUser"];
    for(const key of keys){
      try{
        const raw = localStorage.getItem(key) || sessionStorage.getItem(key);
        if(!raw) continue;
        const user = JSON.parse(raw);
        if(user && typeof user === "object" && (user.discordId || user.discord_id || /^discord-/i.test(String(user.uid||user.id||user.userId||user.key||'')))) return user;
      }catch(e){}
    }
    return null;
  }

  function pklTierIsAdminUser(user){
    if(!user || typeof user !== "object") return false;

    if(user.isAdmin === true || user.admin === true || user.isManager === true || user.isOperator === true) return true;

    const values = [
      user.role,
      user.memberRole,
      user.permission,
      user.grade,
      user.auth,
      user.type,
      user.position,
      user.level,
      user.accountType
    ].map(v => String(v || "").trim().toLowerCase());

    if(values.some(role =>
      role === "manager" ||
      role === "operator" ||
      role === "admin" ||
      role === "administrator" ||
      role === "owner" ||
      role === "master" ||
      role === "총관리자" ||
      role === "관리자" ||
      role === "운영자" ||
      role === "운영진" ||
      role.includes("관리자") ||
      role.includes("운영")
    )) return true;

    return false;
  }

  function pklTierCanEdit(){
    if(window.__PKL_TIER_CAN_EDIT_SERVER === true) return true;
    return pklTierIsAdminUser(pklTierCurrentUserForEdit());
  }
  window.pklTierCanEdit = pklTierCanEdit;

  async function pklTierRefreshCurrentUserPermission(){
    const current = pklTierCurrentUserForEdit();
    const did = String(current?.discordId || current?.discord_id || current?.id || current?.uid || '').replace(/^discord-/i,'').trim();
    if(!did) return;
    try{
      const res = await fetch('/api/pkl-users?q=' + encodeURIComponent(did) + '&limit=20', {cache:'no-store', headers:{Accept:'application/json'}});
      const data = await res.json().catch(() => ({}));
      const users = Array.isArray(data.users) ? data.users : [];
      const found = users.find(u => String(u.discordId || u.discord_id || u.id || u.uid || '').replace(/^discord-/i,'').trim() === did);
      if(found){
        window.__PKL_TIER_CAN_EDIT_SERVER = pklTierIsAdminUser(found);
        try{
          const merged = {...current, ...found};
          ['pklLoginUser','pklCurrentUser','pklLoggedInUser','pkl_current_user','discordUser'].forEach(function(k){ try{ sessionStorage.setItem(k, JSON.stringify(merged)); }catch(e){} try{ localStorage.setItem(k, JSON.stringify(merged)); }catch(e){} });
        }catch(e){}
        document.querySelectorAll('.pkl-tier-member').forEach(node => {
          node.setAttribute('draggable', window.__PKL_TIER_CAN_EDIT_SERVER ? 'true' : 'false');
          node.dataset.canDrag = window.__PKL_TIER_CAN_EDIT_SERVER ? '1' : '0';
        });

        try{ window.dispatchEvent(new CustomEvent('pkl-tier-permission-updated',{detail:{canEdit:window.__PKL_TIER_CAN_EDIT_SERVER,user:found}})); }catch(e){}

      console.error('PKL tier permission refresh failed', e);

  }
  if(document.readyState === 'loading') document.addEventListener('DOMContentLoaded', pklTierRefreshCurrentUserPermission);
  else pklTierRefreshCurrentUserPermission();

  function pklTierVisibleUsers(){
    const state = pklTierReadAdminState();
    const seen = new Set();

    return state.users
      .map((user, index) => {
        const key = pklTierUserKey(user, index);
        const name = pklTierUserName(user);
        const role = pklTierGradeRole(user);
        const lane = PKL_TIER_ROLE_TO_LANE[role] || "";
        return { key, index, name, role, lane, user };
      })
      .filter(item => {
        if(!item.key || !item.name || !item.lane) return false;
        if(seen.has(item.key)) return false;
        seen.add(item.key);
        return true;
      });
  }

  function pklTierSyncUsersToAccountStorage(state){
    /* Supabase 단일 원본: 티어표는 pklUsers/localStorage에 유저 목록을 저장하지 않는다. */
    return;
  }

  function pklTierSetUserRole(userKey, targetLane){
    const targetRole = PKL_TIER_LANE_TO_ROLE[targetLane];
    if(!targetRole) return false;

    const state = pklTierReadAdminState();
    let changed = false;

    state.users = state.users.map((user, index) => {
      if(pklTierUserKey(user, index) !== userKey) return user;

      changed = true;
      const nextTierLabel = PKL_TIER_ROLE_LABELS[targetRole] || "없음";
      return {
        ...user,
        memberTier:targetRole,
        memberTierName:nextTierLabel,
        tier:nextTierLabel,
        updatedAt:new Date().toISOString()
      };
    });

    if(changed) pklTierSaveAdminState(state);
    return changed;
  }

  function renderPklTierMembers(){
    const lists = document.querySelectorAll(".pkl-lane-list[data-tier]");
    if(!lists.length) return;

    lists.forEach(list => {
      list.querySelectorAll(".pkl-tier-member").forEach(node => node.remove());
      list.classList.remove("pkl-drop-ready");
    });

    pklTierVisibleUsers().forEach(item => {
      const list = document.querySelector('.pkl-lane-list[data-tier="' + item.lane + '"]');
      if(!list) return;

      const badge = document.createElement("div");
      badge.className = "pkl-tier-member";
      badge.textContent = item.name;
      badge.dataset.userKey = item.key;
      badge.dataset.lane = item.lane;
      badge.setAttribute("draggable", pklTierCanEdit() ? "true" : "false");
      list.appendChild(badge);
    });

    pklTierBindDrag();
  }

  function pklTierBindDrag(){
    const lists = Array.from(document.querySelectorAll(".pkl-lane-list[data-tier]"));
    document.querySelectorAll(".pkl-tier-member").forEach(badge => {
      badge.setAttribute("draggable", pklTierCanEdit() ? "true" : "false");
      badge.dataset.canDrag = pklTierCanEdit() ? "1" : "0";

      badge.ondragstart = function(e){
        if(!pklTierCanEdit()){
          e.preventDefault();
          return false;
        }

        badge.classList.add("pkl-dragging");
        e.dataTransfer.effectAllowed = "move";
        e.dataTransfer.setData("text/plain", JSON.stringify({
          userKey:badge.dataset.userKey,
          from:badge.dataset.lane
        }));

        try{
          const ghost = badge.cloneNode(true);
          ghost.style.position = "fixed";
          ghost.style.top = "-1000px";
          ghost.style.left = "-1000px";
          ghost.style.zIndex = "999999";
          ghost.style.pointerEvents = "none";
          ghost.style.opacity = "0.96";
          ghost.style.transform = "scale(1.08)";
          ghost.style.boxShadow = "0 14px 34px rgba(0,0,0,.52), 0 0 24px rgba(168,85,247,.46)";
          document.body.appendChild(ghost);
          e.dataTransfer.setDragImage(ghost, Math.max(10, Math.floor(ghost.offsetWidth / 2)), Math.max(10, Math.floor(ghost.offsetHeight / 2)));
          setTimeout(function(){ ghost.remove(); }, 0);
        }catch(err){}
      };

      badge.ondragend = function(){
        badge.classList.remove("pkl-dragging");
        lists.forEach(list => list.classList.remove("pkl-drop-ready"));
      };
    });

    lists.forEach(list => {
      list.ondragenter = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        list.classList.add("pkl-drop-ready");
      };

      list.ondragover = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        if(e.dataTransfer) e.dataTransfer.dropEffect = "move";
        list.classList.add("pkl-drop-ready");
      };

      list.ondragleave = function(e){
        if(!list.contains(e.relatedTarget)) list.classList.remove("pkl-drop-ready");
      };

      list.ondrop = function(e){
        if(!pklTierCanEdit()) return;
        e.preventDefault();
        e.stopPropagation();
        list.classList.remove("pkl-drop-ready");

        let payload = {};
        try{
          payload = JSON.parse(e.dataTransfer.getData("text/plain") || "{}");
        }catch(err){}

        const targetLane = list.dataset.tier;
        if(!payload.userKey || !targetLane || payload.from === targetLane) return;

        if(pklTierSetUserRole(payload.userKey, targetLane)){
          renderPklTierMembers();
        }
      };
    });
  }

  window.renderPklTierMembers = renderPklTierMembers;
  window.pklTierSetUserRole = pklTierSetUserRole;

  /* PKL TIER CLICK GUARD */
  function pklTierIsScoreInput(target){
    return !!(target && target.closest && target.closest(".pkl-lane-score input"));
  }

  function pklTierBlockNonInputSelection(e){
    return;
  }

  document.addEventListener("contextmenu", function(e){
    if(pklTierIsScoreInput(e.target)) return;
    if(e.target && e.target.closest && e.target.closest(".pkl-tier-shell")){
      e.preventDefault();
    }
  });

  document.addEventListener("selectstart", pklTierBlockNonInputSelection);

  document.addEventListener("mousedown", function(e){
    return;
  });

  window.pklTierClickGuardReady = true;

document.addEventListener("DOMContentLoaded", function(){
    syncTop();
    /* Supabase fetch 전 구버전/빈 state 렌더 금지.
       티어표 멤버는 아래 Supabase 전용 renderer가 1회만 그린다. */
    const modal = document.getElementById("mailboxModal");
    if(modal){
      modal.addEventListener("click", e => {
        if(e.target === modal) closeMailboxModal();
      });
    }
  });
  /* 2차 청소: storage 이벤트 기반 티어표 자동 재렌더 금지. Supabase fetch/페이지 진입 기준만 사용. */
})();
</script>



<script id="pklTierScoreSyncScript">
(function(){
  'use strict';
  if(window.__PKL_TIER_SCORE_SYNC_20260523_V50__) return;
  window.__PKL_TIER_SCORE_SYNC_20260523_V50__ = true;

  /*
   * PKL 20260523 v50
   * 티어 목표점수/감점 저장 원본을 Supabase pkl_shared_data 한 곳으로 다시 고정한다.
   * 이전 v47~v49에서 겹친 pkl-data-store/pkl-shared 후처리와 기본값 재저장 흐름을 끊고,
   * 저장은 /api/pkl-shared + Supabase REST fallback으로만 수행한다.
   */
  const SCORE_KEY = 'pklTierScoreConfig';
  const META_KEY = '__pklUpdatedAt';
  const ROLE_TO_LANE = {
    tier0_high:'0상', tier0_mid:'0중', tier0_low:'0하',
    tier1_high:'1상', tier1_mid:'1중', tier1_low:'1하',
    tier2_high:'2상', tier2_mid:'2중', tier2_low:'2하',
    tier3_high:'3상', tier3_mid:'3중', tier3_low:'3하',
    tier4_high:'4상', tier4_mid:'4중', tier4_low:'4하',
    tier5_high:'5상', tier5_mid:'5중', tier5_low:'5하', beast:'5하'
  };
  const LANE_TO_ROLE = Object.keys(ROLE_TO_LANE).reduce((map, role) => {
    if(role === 'beast') return map;
    map[ROLE_TO_LANE[role]] = role;
    return map;
  }, {});

  let config = {};
  let saveTimer = 0;
  let loading = false;
  let dirtySince = 0;
  let lastAppliedServerStamp = 0;

  function numberValue(v, fallback){
    const n = Number(String(v ?? '').replace(/[^0-9.-]/g, ''));
    return Number.isFinite(n) ? n : fallback;
  }
  function nowIso(){ return new Date().toISOString(); }
  function getBox(value){
    if(!value || typeof value !== 'object') return {};
    if(value.value && typeof value.value === 'object') return value.value;
    if(value.payload && typeof value.payload === 'object') return value.payload;
    if(value.config && typeof value.config === 'object') return value.config;
    if(value.data && typeof value.data === 'object') return value.data;
    return value;
  }
  function normalize(value){
    const src = getBox(value);
    const out = {};
    if(!src || typeof src !== 'object') return out;
    Object.keys(src).forEach(key => {
      if(key === META_KEY || key === 'updatedAt' || key === 'updated_at') return;
      const row = src[key];
      if(!row || typeof row !== 'object') return;
      if(!('target' in row) && !('death' in row)) return;
      const lane = ROLE_TO_LANE[key] || key;
      const target = numberValue(row.target, 0);

      if(Number.isFinite(nested)) return nested;

  function collectFromDom(seed){
    const out = publicConfig(seed || config);
    document.querySelectorAll('.pkl-tier-lane, .pkl-beast-line').forEach(laneEl => {
      const list = laneEl.querySelector('.pkl-lane-list[data-tier]');
      const inputs = laneEl.querySelectorAll('.pkl-lane-score input');
      if(!list || inputs.length < 2) return;
      const lane = String(list.dataset.tier || '').trim();
      if(!lane) return;
      const target = numberValue(inputs[0].value, numberValue(inputs[0].getAttribute('value'), 0));
      const death = numberValue(inputs[1].value, numberValue(inputs[1].getAttribute('value'), 0));
      out[lane] = { target, death };
      const role = LANE_TO_ROLE[lane];
      if(role) out[role] = { target, death, lane };

    out[META_KEY] = nowIso();
    out.updatedAt = out[META_KEY];
    return out;
  }
  function applyToDom(next){
    const cfg = normalize(next || config);
    if(!hasRows(cfg)) return;
    document.querySelectorAll('.pkl-tier-lane, .pkl-beast-line').forEach(laneEl => {
      const list = laneEl.querySelector('.pkl-lane-list[data-tier]');
      const inputs = laneEl.querySelectorAll('.pkl-lane-score input');
      if(!list || inputs.length < 2) return;
      const lane = String(list.dataset.tier || '').trim();
      const saved = cfg[lane];

      inputs[0].setAttribute('value', String(saved.target));
      inputs[1].setAttribute('value', String(saved.death));
    });
  }
  function setConfig(next, options){
    options = options || {};
    const normalized = normalize(next || {});
    if(!hasRows(normalized)) return;

    window.__PKL_TIER_SCORE_CONFIG = publicConfig(config);

    if(!options.silent){
      try{ window.dispatchEvent(new CustomEvent('pkl-tier-score-config-updated', { detail:{ config:publicConfig(config) } })); }catch(e){}
    }
  }
  async function getSupabaseConfig(){
    if(window.PKLGetSupabaseConfig && typeof window.PKLGetSupabaseConfig === 'function'){
      try{ const cfg = await window.PKLGetSupabaseConfig(); if(cfg) return cfg; }catch(e){}
    }
    return window.PKL_SUPABASE_CONFIG || {};
  }
  function cleanSupabaseUrl(url){ return String(url || '').replace(/\/rest\/v1\/?$/i, '').replace(/\/+$/, ''); }
  async function readViaSharedApi(){
    const res = await fetch('/api/pkl-shared?key=' + encodeURIComponent(SCORE_KEY) + '&_=' + Date.now(), {
      method:'GET', cache:'no-store', headers:{ Accept:'application/json', 'Cache-Control':'no-store' }

  async function readViaRest(){

    const key = String(cfg.anonKey || cfg.anon_key || cfg.supabaseAnonKey || cfg.SUPABASE_ANON_KEY || '');
    if(!url || !key) return null;
    const res = await fetch(url + '/rest/v1/pkl_shared_data?select=key,value,updated_at&key=eq.' + encodeURIComponent(SCORE_KEY) + '&limit=1', {
      method:'GET', cache:'no-store', headers:{ apikey:key, Authorization:'Bearer ' + key, Accept:'application/json', 'Cache-Control':'no-store' }
    });
    const rows = await res.json().catch(()=>[]);
    if(!res.ok) throw new Error(String(res.status));
    const row = Array.isArray(rows) ? rows[0] : null;
    if(row && hasRows(row.value)) return { value:row.value, updated_at:row.updated_at || '' };
    return null;
  }
  async function readServer(){
    const found = [];
    try{ const item = await readViaSharedApi(); if(item) found.push(item); }catch(e){ console.warn('PKL tier score shared api read failed', e); }
    try{ const item = await readViaRest(); if(item) found.push(item); }catch(e){ console.warn('PKL tier score rest read failed', e); }

      const bs = Date.parse(b.updated_at || '') || getStamp(b.value) || 0;
      const as = Date.parse(a.updated_at || '') || getStamp(a.value) || 0;

  window.addEventListener('beforeunload', function(){ try{ save(true); }catch(e){} });

})();
</script>

<script id="pkl-global-stacked-modal-layer-script">
(function(){
  if(window.__PKL_STACKED_MODAL_LAYER_FINAL__) return;
  window.__PKL_STACKED_MODAL_LAYER_FINAL__=true;
  var BASE=2147481000;
  var step=0;
  var modalSelector=[
    '.modal',
    '.edit-modal',
    '.member-edit-modal',
    '.temp-edit-modal',
    '.pkl-notice-layer',
    '.pkl-result-admin-modal',
    '.pkl-delete-confirm-modal',
    '#resultAdminModal',
    '#resultDeleteConfirmModal'
  ].join(',');
  function isOpen(el){
    if(!el || !el.classList) return false;
    var cs;
    try{cs=getComputedStyle(el);}catch(e){cs=null;}
    return el.classList.contains('open') ||
      el.getAttribute('aria-hidden')==='false' ||
      (cs && cs.position==='fixed' && cs.display!=='none' && cs.visibility!=='hidden' && cs.opacity!=='0');
  }
  function setLayer(el,z){
    if(!el || !el.style) return;
    el.classList.add('pkl-layer-managed-modal');
    el.style.setProperty('z-index', String(z), 'important');
    el.style.setProperty('pointer-events', 'auto', 'important');
    var kids=el.querySelectorAll(':scope > *, [role="dialog"], .modal-box, .modal-card, .pkl-result-admin-panel, .pkl-delete-confirm-box, .pkl-notice-card, .temp-edit-box');
    kids.forEach(function(k){
      k.style.setProperty('z-index', String(z+1), 'important');
      k.style.setProperty('pointer-events','auto','important');
      if(getComputedStyle(k).position==='static') k.style.setProperty('position','relative','important');
    });
  }
  function bring(el){
    if(!el) return;
    step+=10;
    setLayer(el,BASE+step);
  }
  function scan(){
    Array.prototype.forEach.call(document.querySelectorAll(modalSelector),function(el){
      if(isOpen(el) && !el.dataset.pklLayerNoAuto){
        if(!el.dataset.pklLayerOrder){
          el.dataset.pklLayerOrder=String(++step);
        }
        setLayer(el,BASE+Number(el.dataset.pklLayerOrder));
      }else if(el && el.dataset){
        delete el.dataset.pklLayerOrder;
      }
    });
  }
  window.PKLBringModalToFront=function(el){
    if(typeof el==='string') el=document.querySelector(el);
    if(el){ delete el.dataset.pklLayerOrder; bring(el); }
  };
  document.addEventListener('click',function(e){
    var el=e.target && e.target.closest && e.target.closest(modalSelector);
    if(el) window.PKLBringModalToFront(el);
    setTimeout(scan,0);
    setTimeout(scan,80);
  },true);
  var mo=new MutationObserver(function(list){
    list.forEach(function(m){
      var el=m.target;
      if(el && el.matches && el.matches(modalSelector) && isOpen(el)) window.PKLBringModalToFront(el);

    setTimeout(scan,0);
  });
  function boot(){
    try{mo.observe(document.documentElement,{subtree:true,attributes:true,attributeFilter:['class','style','aria-hidden']});}catch(e){}
    scan();
    /* 반복 스캔 제거: MutationObserver/click 시점에만 정렬 */
  }
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',boot); else boot();
})();
</script>
